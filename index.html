<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안다미로 - 속담과 순우리말</title>
<meta name="theme-color" content="#1F6F68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192-3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안다미로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EA; --paper2:#F3EAD3; --ink:#2B2A28; --mute:#7A7468; --line:#E3D8BE;
  --pv:#B9482F; --pv-soft:#F6DDD3; --pv-deep:#8A3220;
  --wd:#23766F; --wd-soft:#D5EBE7; --wd-deep:#15524D;
  --display:'Jua','Noto Sans KR',sans-serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18.4px;line-height:1.6}
html,body{overflow-x:clip;max-width:100%}
body{word-break:keep-all;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
.screen{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.bar{position:sticky;top:0;z-index:30;margin:-20px -18px 12px;padding:8px 18px;background:rgba(251,246,234,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;gap:3px;font-size:13px;line-height:1;white-space:nowrap;min-width:0;max-width:100%}
.nav .nv{height:28px;padding:0 10px;border-radius:99px;background:var(--paper2);color:var(--ink);font-weight:600;font-size:13px;flex:0 .15 auto;min-width:2.6em;overflow:hidden;text-overflow:ellipsis}
.nav .sp{color:var(--mute);flex:none;font-size:12px}
.nav .cur{flex:0 2 auto;height:28px;display:inline-flex;align-items:center;padding:0 11px;border-radius:99px;background:var(--pv);color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:4em}
@media(max-width:420px){.nav .hubc,.nav .hubc+.sp{display:none}.nav .homec{font-size:0;padding:0 11px}.nav .homec::before{content:'🏠';font-size:15px}}
.nav.wd .cur{background:var(--wd)}

/* 허브: 소주제 전체 보기 */
/* 메인1(주제 첫 화면): 한 화면에 꽉 차게 */
.screen.hubfit{display:flex;flex-direction:column;height:calc(100dvh - 36px)}
html:has(.hubfit){overflow:hidden;height:100%}
body:has(.hubfit){overflow:hidden}
#app:has(.hubfit){padding-bottom:10px;min-height:0}
.hubfit .hubhead{flex:none;margin-bottom:10px}
.hubfit .ggrid{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);gap:10px;margin-top:0}
.hubfit .ggrid.n4,.hubfit .ggrid.n6{grid-template-columns:1fr 1fr}
.hubfit .gtile,.hubfit .ggrid.n4 .gtile{min-height:0;padding:12px 12px 10px;overflow:hidden}
.hubfit .gtile .te{font-size:clamp(28px,5dvh,42px)}
.hubfit .gtile b{font-size:clamp(17px,2.6dvh,21px);margin-top:4px}
.hubfit .gtile small{font-size:clamp(11.5px,1.7dvh,13.5px)}
.hsrc{flex:none;margin-top:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(160deg,#FFFBEF,#FFF0CF);border:1px solid rgba(190,140,50,.35);box-shadow:0 2px 0 rgba(0,0,0,.05);color:#5A4524;font-size:12.6px;line-height:1.45;display:flex;flex-direction:column;gap:5px}
.hsrc div{display:flex;gap:8px;align-items:flex-start}
.hsrc i{flex:none;font-style:normal;font-weight:800;font-size:12px;color:#fff;background:var(--pv);border-radius:99px;padding:1px 9px;margin-top:1px}
.hsrc.wd i{background:var(--wd)}
.hsrc span{word-break:keep-all}
@media(max-height:720px){.hubfit .gtile small{font-size:11px;line-height:1.3}.hubfit .hubhead p{display:none}.hsrc{font-size:11.5px;padding:8px 10px}}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.gtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:22px;padding:16px 14px 14px;color:#2B2A28;background:linear-gradient(160deg,var(--c1),var(--c2));min-height:150px;box-shadow:0 5px 0 rgba(0,0,0,.10);transition:transform .1s,box-shadow .1s}
.gtile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.10)}
.ggrid.n4 .gtile{min-height:210px}
.gtile .te{font-size:42px;line-height:1.1}
.gtile b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.25;margin-top:8px;word-break:keep-all}
.gtile small{font-size:13.5px;color:#3f4a47;margin-top:3px;word-break:keep-all;line-height:1.4}
.gtile em{font-style:normal;margin-top:auto;padding-top:8px;font-size:13px;font-weight:700;color:#14524D}
.gtile em.wait{color:#7a6a4a}
.gtile .gar{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:20px}
.ghead{border-radius:0 0 26px 26px;padding:16px 18px 16px;margin:0 -18px 12px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#2B2A28}
.gh2{display:flex;align-items:center;gap:12px}
.hback.gb{background:rgba(255,255,255,.55);color:#2B2A28;margin-bottom:10px}
.ghead .te{font-size:40px;line-height:1}
.ghead h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.ghead p{font-size:14px;color:#3f4a47;margin-top:2px}
/* 탭 카드: 카드마다 다른 색, 선택하면 아래 내용 띠와 같은 색 */
.tabs.o3 .chip{background:color-mix(in srgb,var(--cm) 13%,#fff);border:2px solid color-mix(in srgb,var(--cm) 38%,#fff);color:#3a342a;transition:transform .1s,box-shadow .1s}
.tabs.o3 .chip.on{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c2);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(-1px);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tabs.o3 .chip.on .gn{color:var(--c2);background:rgba(255,255,255,.88);text-shadow:none}
#obody .story,#gbody .story{border:2px solid var(--cm)}
#obody .gdesc b,#gbody .gdesc b{color:var(--c2)}
.rhd.rhc{padding:7px 8px 7px 14px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;min-height:40px}
.rhd.rhc b{color:#fff;font-size:16px}
.rhd.rhc button{background:rgba(255,255,255,.88);color:var(--c2)}
#fst[style] .ri .rn{background:color-mix(in srgb,var(--pv) 16%,#fff);color:var(--pv-deep)}
#fst[style] .ri.on .rn{background:var(--pv);color:#fff}
/* 속담의 유래: 탭 고정 */
.otw{position:sticky;top:44px;z-index:25;margin:-12px -18px 10px;padding:8px 18px 8px;background:rgba(251,246,234,.97);box-shadow:0 1px 0 var(--line)}
.otw.gtw{margin:0 -18px 10px}
.tabs.o3{grid-template-columns:repeat(3,1fr);gap:6px;padding:0;margin:0}
.tabs.o3.c2{grid-template-columns:1fr 1fr}
.tabs.o3 .chip{flex-direction:column;gap:2px;min-height:54px;padding:6px 4px;font-size:13px;font-weight:700;border-radius:12px}
.tabs.o3 .chip .ti{font-size:21px;line-height:1}
.cta.nx{position:sticky;bottom:8px;z-index:20;display:block;width:auto;margin:14px auto 0;padding:9px 22px;font-size:14.5px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.o-wrap .cta.nx{margin:0 auto;padding:8px 20px;position:static;box-shadow:none}
/* 속담의 유래: 한 화면에 딱 맞춤 */
#app:has(.o-wrap){padding-bottom:10px;min-height:0}
.screen:has(.o-wrap){display:flex;flex-direction:column;height:calc(100dvh - 36px)}
.o-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.o-wrap .otw{position:static;margin:0 -18px 6px;padding:2px 18px 8px;box-shadow:none;background:none}
.o-wrap .tabs.o3 .chip{min-height:clamp(44px,7dvh,56px);font-size:12.5px}
.o-wrap .tabs.o3 .chip .ti{font-size:clamp(17px,2.6dvh,22px)}
.o-wrap #obody{flex:1;min-height:0;display:flex;flex-direction:column}
.o-wrap .gdesc{flex:none;margin:0 2px 6px}
.o-wrap .gdesc b{font-size:19px}
.o-wrap .gdesc p{font-size:14px;line-height:1.35;margin-top:1px}
.o-wrap .slider{flex:1;min-height:0;padding:0;align-items:stretch}
.o-wrap .story{display:flex;flex-direction:column;overflow-y:auto;margin:0}
.o-wrap .story .scene{flex:none;height:clamp(54px,11dvh,96px)}
.o-wrap .story .scene .se{font-size:clamp(30px,5.4dvh,46px)}
.o-wrap .story .sb{padding:10px 14px 12px;flex:1}
.o-wrap .story h4{font-size:clamp(17px,2.5dvh,21px);margin-top:1px}
.o-wrap .story .ob{font-size:clamp(14.5px,2.1dvh,16.7px);line-height:1.55;margin-top:4px}
.o-wrap .story .sm{font-size:clamp(14px,1.95dvh,16px);margin-top:7px;padding:7px 11px}
.o-wrap .pg{flex:none;margin:6px 0 6px}
.o-wrap .pgb{height:40px;width:50px}
@media(max-height:720px){
.o-wrap .gdesc p{display:none}
.o-wrap .tabs.o3 .chip{min-height:42px;padding:3px 4px;gap:1px}
.o-wrap .tabs.o3 .chip .ti{font-size:15px}
.o-wrap .story .scene{height:40px}
.o-wrap .story .scene .se{font-size:24px}
.o-wrap .story .sn{display:none}
.o-wrap .story .sb{padding:8px 12px 10px}
.o-wrap .story .hint{display:none}
.o-wrap .pgb{height:34px}
.o-wrap .pg{margin:4px 0}
.o-wrap .dots{margin-top:2px}
}
/* 상단 배너 공통: 은은한 패턴 + 도형 분할 */
:root{--pat-sg:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2218%22%3E%3Cg fill=%22none%22 stroke=%22%23FFE2A0%22 stroke-opacity=%22.15%22 stroke-width=%221%22%3E%3Ccircle cx=%220%22 cy=%220%22 r=%2216%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%2211%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%226%22/%3E%3Ccircle cx=%2236%22 cy=%220%22 r=%2216%22/%3E%3Ccircle cx=%2236%22 cy=%220%22 r=%2211%22/%3E%3Ccircle cx=%2236%22 cy=%220%22 r=%226%22/%3E%3Ccircle cx=%2218%22 cy=%229%22 r=%2216%22/%3E%3Ccircle cx=%2218%22 cy=%229%22 r=%2211%22/%3E%3Ccircle cx=%2218%22 cy=%229%22 r=%226%22/%3E%3C/g%3E%3C/svg%3E");--pat-dot:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2222%22 height=%2222%22%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%222%22 fill=%22%23E4FFF6%22 fill-opacity=%22.16%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3Ccircle cx=%2222%22 cy=%220%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3Ccircle cx=%220%22 cy=%2222%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3Ccircle cx=%2222%22 cy=%2222%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3C/svg%3E");--pat-dia:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2218%22 height=%2218%22%3E%3Cpath d=%22M9 1.5 L16.5 9 L9 16.5 L1.5 9Z%22 fill=%22none%22 stroke=%22%232B2A28%22 stroke-opacity=%22.08%22 stroke-width=%221%22/%3E%3C/svg%3E");--pat-diaw:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2218%22 height=%2218%22%3E%3Cpath d=%22M9 1.5 L16.5 9 L9 16.5 L1.5 9Z%22 fill=%22none%22 stroke=%22%23fff%22 stroke-opacity=%22.2%22 stroke-width=%221%22/%3E%3C/svg%3E")}
.hubhead,.lbanner,.ghead,.fhead{position:relative;overflow:hidden;isolation:isolate}
.hubhead::after,.lbanner::after,.ghead::after,.fhead::after{content:"";position:absolute;right:-34px;top:-46px;width:132px;height:132px;border-radius:50%;border:1.5px dashed rgba(255,236,180,.5);box-shadow:0 0 0 14px rgba(255,236,180,.08),inset 0 0 0 12px rgba(255,236,180,.06);z-index:-1;pointer-events:none}
.hubhead.pv,.lbanner.pv,.fhead.pv{background:linear-gradient(112deg,transparent 0 70%,rgba(70,15,8,.18) 70% 100%),radial-gradient(circle at 90% 10%,rgba(255,226,160,.40),transparent 48%),var(--pat-sg),linear-gradient(135deg,#DB5B3E,#B13A25 55%,#862618)}
.hubhead.wd,.lbanner.wd,.fhead.wd{background:linear-gradient(112deg,transparent 0 70%,rgba(4,50,45,.20) 70% 100%),radial-gradient(circle at 90% 10%,rgba(228,255,246,.38),transparent 48%),var(--pat-dot),linear-gradient(135deg,#3AA79B,#1F7B71 55%,#145C54)}
.hubhead::before,.lbanner::before,.fhead::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,rgba(240,191,90,.9),transparent);z-index:-1}
.ghead{background:linear-gradient(112deg,transparent 0 72%,rgba(255,255,255,.22) 72% 100%),radial-gradient(circle at 92% 8%,rgba(255,255,255,.6),transparent 46%),var(--pat-dia),linear-gradient(160deg,var(--c1),var(--c2))}
.gtile{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.5),transparent 55%),var(--pat-dia),linear-gradient(160deg,var(--c1),var(--c2))}
.i3{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.35),transparent 50%),var(--pat-diaw),linear-gradient(150deg,var(--c1),var(--c2))}
.lbanner{margin:-12px -18px 14px;padding:16px 20px 20px;border-radius:0 0 26px 26px;color:#fff}
.lbanner h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.25;margin:0 0 4px;color:#FFF6DC;text-shadow:0 2px 0 rgba(60,12,6,.35);word-break:keep-all}
.lbanner .lead{color:rgba(255,255,255,.95);margin:0;font-size:15.5px;line-height:1.5}
/* ===== 검색 화면: 한 화면 맞춤 + 가로 넘기기 ===== */
#app:has(.fitwrap){padding-bottom:10px;min-height:0}
.screen:has(.fitwrap){display:flex;flex-direction:column;height:calc(100dvh - 36px)}
.fitwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.fitwrap.wd{--pv:var(--wd);--pv-soft:var(--wd-soft);--pv-deep:var(--wd-deep)}
.fhead{display:flex;align-items:center;gap:10px;margin:-12px -18px 8px;padding:9px 18px 11px;color:#fff;border-radius:0 0 20px 20px;flex:none}
.fhead .fhe{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.fhead b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;color:#FFF6DC;display:block}
.fhead small{display:block;font-size:13px;line-height:1.3;opacity:.95;margin-top:1px;word-break:keep-all}
.fctl{flex:none;margin-bottom:6px}
.fin{display:flex;gap:8px;position:relative}
.fin input{flex:1;min-width:0;font:inherit;font-size:17.5px;padding:10px 40px 10px 13px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
.fin input:focus{border-color:var(--pv)}
.fin input::placeholder{font-size:16px;color:#9b9486}
.fin .fclr{position:absolute;right:6px;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:50%;color:#8a8372;font-size:15px}
.fin .fgo{flex:none;padding:0 16px;border-radius:14px;background:var(--pv);color:#fff;font-weight:700;font-size:15.5px}
.fchips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.fchips .chip{padding:5px 12px;font-size:14px}
.fchips .chip.on{background:var(--pv);color:#fff}
.fitwrap .jamo{grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 0}
.fitwrap .jamo button{padding:3px 0;font-size:17px;border-radius:9px}
.fseg{display:flex;gap:6px;background:var(--paper2);border-radius:99px;padding:4px}
.fseg button{flex:1;text-align:center;padding:8px 0;border-radius:99px;font-weight:700;font-size:16px}
.fseg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);color:var(--pv-deep)}
.fstage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.fmsg{margin:auto;text-align:center;color:var(--mute);font-size:16px;line-height:1.6;padding:0 20px;word-break:keep-all}
.fmsg b{display:block;color:var(--ink);font-size:17px}
.fmsg .em{display:block;font-size:34px}
.fpg{flex:none;display:flex;align-items:center;gap:10px;margin:6px 0 4px;min-height:0}
.fpg:empty{display:none}
.fpg .pgm{flex:1;min-width:0}
.fpg .pgm b{display:block;text-align:center;font-size:15px}
.fpg input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--pv);height:22px}
.fpg .pgb{height:40px;width:50px}
.cp{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cp::-webkit-scrollbar{display:none}
.cpage{flex:0 0 100%;scroll-snap-align:start;display:grid;gap:8px;align-content:stretch;padding:2px 1px}
.ftile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:18px;padding:6px 4px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#2B2A28;box-shadow:0 4px 0 rgba(0,0,0,.1);min-width:0;transition:transform .08s}
.vtile{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:14px;background:#fff;border:1px solid var(--line);overflow:hidden;color:var(--ink);text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.fitwrap.vid .fstage{background:none;border-radius:0;padding:4px 2px 2px}
.fitwrap.vid .cpage{column-gap:18px;row-gap:12px;padding:2px 2px 6px}
.fitwrap.vid .vtile{background:var(--vc);border:0;box-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 10px rgba(0,0,0,.12);border-radius:14px;color:#fff}
.fitwrap.vid .vtile .vth{border-radius:14px 14px 0 0}
.fitwrap.vid .vtile b{color:#fff;font-weight:800}
.fitwrap.vid .vtile small{color:rgba(255,255,255,.85)}
.fitwrap.vid .eh{background:rgba(0,0,0,.14)}
.vtile:active{transform:translateY(2px)}
.vtile .vth{flex:1;min-height:0;position:relative;background:linear-gradient(150deg,#E5663F,#8E2A1B) center/cover no-repeat;display:block}
.vtile .vpl{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(200,30,30,.92);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;padding-left:2px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.vtile b{flex:none;font-size:12.3px;line-height:1.25;padding:4px 7px 0;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtile small{flex:none;font-size:10.5px;color:var(--mute);padding:1px 7px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile.rich{position:relative;overflow:hidden;gap:2px;padding:6px 6px 8px;justify-content:flex-end;--d:clamp(62px,8.4dvh,82px)}
.ftile.rich.dns{--d:clamp(52px,7.1dvh,64px);padding:4px 5px 6px}
.ftile.rich .rdc{position:absolute;opacity:.18;pointer-events:none;font-size:clamp(28px,5dvh,48px);line-height:1}

.hero h1{font-family:var(--display);font-size:60px;letter-spacing:.04em;font-weight:400;line-height:1.1;color:#1F6F68}

.hero .def{font-family:var(--sans);font-size:18.4px;font-weight:500;margin-top:14px;color:#4a463e}
.hero .ex{word-break:keep-all;text-wrap:balance;font-family:var(--sans);font-size:16.1px;line-height:1.55;margin:10px 4px 0;padding:10px 14px;border-radius:14px;background:var(--paper2);color:#5b5548;text-align:left}

.hero .def b{color:var(--pv)}
.mains{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 -18px}
.main{position:relative;border-radius:0;padding:24px 10px 22px;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(28px,9dvh,90px);text-align:center;gap:14px;width:100%;min-height:max(260px,calc(100vh - min(100vw,560px)*.944 - 24px));min-height:max(260px,calc(100dvh - min(100vw,560px)*.944 - 24px));transition:filter .1s}
.main:active{filter:brightness(.92)}
.main.pv{background:linear-gradient(160deg,#C9553A,#A63C26)}
.main.wd{background:linear-gradient(160deg,#2E8B83,#1B625C)}
.main .ico{flex:none;width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--display);font-size:58px;line-height:1}
.main .mt{min-width:0}
.main h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.25;margin:0 0 8px}
.main p{font-size:15.5px;line-height:1.5;opacity:.95;word-break:keep-all;padding:0 4px}
.main .go{position:static;margin:4px 0 0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px}
.main .ico{position:relative;overflow:visible}
.mc{position:absolute;font-style:normal;font-family:var(--display);font-size:20px;line-height:1;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#5a2a14;box-shadow:0 3px 0 rgba(0,0,0,.18);animation:bob 3s ease-in-out infinite}
.m1{right:-26px;bottom:-14px;width:40px;height:40px;font-size:26px;background:#FFD36B;transform:rotate(10deg);border-radius:13px}
.m2{left:-18px;top:-12px;width:auto;height:auto;background:none;box-shadow:none;color:#FFE7A8;font-size:22px;animation-delay:.6s}
.m3{left:-30px;top:-8px;background:#FFD36B;transform:rotate(-12deg);animation-delay:.2s}
.m4{right:-28px;top:6px;background:#FF9DB0;transform:rotate(10deg);animation-delay:.9s;color:#6b1f33}
.m5{right:-10px;bottom:-14px;background:#9BE8DA;transform:rotate(-6deg);animation-delay:1.4s;color:#0f4a45}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
/* 메인 카드 3D 스타일 */
.main{isolation:isolate}
.main .mbg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.main.pv,.main.wd{background:none}
.main .ico{width:98px;height:98px;border-radius:27px;font-size:64px;background:linear-gradient(180deg,#FFFEF6,#FFE9B4 58%,#F7C666);color:#B2321D;text-shadow:0 2px 0 rgba(255,255,255,.8);box-shadow:0 8px 0 #A86D0C,0 16px 20px rgba(0,0,0,.38),inset 0 2px 0 #fff,inset 0 -3px 6px rgba(168,109,12,.25)}
.main.wd .ico{background:linear-gradient(180deg,#FFFFFF,#DDF7F0 58%,#A5E3D6);color:#136F65;box-shadow:0 8px 0 #0B5A52,0 16px 20px rgba(0,0,0,.38),inset 0 2px 0 #fff,inset 0 -3px 6px rgba(11,90,82,.22)}
.main .ico::before{content:"";position:absolute;left:8px;right:8px;top:6px;height:36%;border-radius:20px 20px 40px 40px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.main h2{color:#FFF6DC;text-shadow:0 2px 0 #6B1D11,0 4px 0 #531409,0 8px 12px rgba(0,0,0,.35);margin-bottom:14px;position:relative}

.main h2::after{content:"✦";display:block;margin:8px auto 0;font-size:12px;color:#F0BF5A;line-height:1;text-shadow:none;background:linear-gradient(90deg,transparent,#F0BF5A 30%,#F0BF5A 70%,transparent) center/70% 1px no-repeat;background-position:center}
.main p{color:#FFF1D6;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.main .go{background:linear-gradient(180deg,#FFEBB0,#F0B84D);color:#8E2A1B;box-shadow:0 4px 0 #A86D0C,0 8px 12px rgba(0,0,0,.3);font-weight:700}
.main.wd .go{color:#0F5F57}
.m1,.m3{box-shadow:0 4px 0 #A86D0C,0 7px 8px rgba(0,0,0,.28);background:linear-gradient(180deg,#FFE894,#F0B03A)}
.m4{box-shadow:0 4px 0 #962F52,0 7px 8px rgba(0,0,0,.28);background:linear-gradient(180deg,#FFB8CB,#EE6C90)}
.m5{box-shadow:0 4px 0 #0F5F57,0 7px 8px rgba(0,0,0,.28);background:linear-gradient(180deg,#B6F2E5,#52CDB7)}

.pgm{flex:1;text-align:center;min-width:0}

const $app = document.getElementById('app');
const leafIndex = {}, hubOf = {};
Object.entries(MENU).forEach(([k,m])=>m.groups.forEach(g=>g.items.forEach(it=>{leafIndex[it.id]=it;hubOf[it.id]=k;it.status=it.status||'todo';})));
const allLeaves = Object.values(leafIndex);
const GIC={'p-intro':'📜','p-media':'🎬','p-find':'📖','p-quiz':'🏆','w-find':'🔤','w-right':'✏️','w-check':'🏆','w-media':'🎬'};
const groupIndex={}; Object.entries(MENU).forEach(([k,m])=>m.groups.forEach(g=>{ groupIndex[g.id]={k,g}; g.items.forEach(it=>{it.gid=g.id;}); }));
const doneCount = a => a.filter(i=>i.status==='done').length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


function nav(trail, cls, ob){
  const last=trail.length-1;
  return `<nav class="nav ${cls||''}${ob?' ob'+(ob==='g'?' gb':''):''}" aria-label="현재 위치">`+trail.map((t,i)=>i===last?`<span class="cur" aria-current="page">${esc(t[0])}</span>`:`<button class="nv${i===1&&last>=3?' hubc':''}${i===0&&last>=3?' homec':''}" data-go="${t[1]}">${i===0?'🏠 ':''}${esc(t[0])}</button><span class="sp">›</span>`).join('')+`</nav>`;
}
function bar(trail, cls){ return `<div class="bar">${nav(trail,cls)}</div>`; }

function tintOf(id){

  const m=MENU[hubOf[id]], g=groupIndex[it.gid].g, pal=FCOL[m.cls], c=pal[Math.max(0,g.items.indexOf(it))%pal.length];

function setupPager(px){
  const sl=document.getElementById(px+'sl'); if(!sl) return;
  const n=sl.children.length, cnt=document.getElementById(px+'cnt'), dots=[...document.querySelectorAll('#'+px+'dots i')];
  const idx=()=>Math.max(0,Math.min(n-1,Math.round(sl.scrollLeft/(sl.clientWidth+12))));
  const eh=edgeHints(sl,idx,n);
  const upd=()=>{ const i=idx(); cnt.textContent=(i+1)+' / '+n; dots.forEach((d,k)=>d.classList.toggle('on',k===i)); eh(); };
  sl.addEventListener('scroll',upd,{passive:true}); upd(); setTimeout(upd,300);
}
const pagerBar=(px,n)=>`<div class="pg"><div class="pgm"><b id="${px}cnt">1 / ${n}</b><div class="dots" id="${px}dots">${Array.from({length:n},(_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div></div></div>`;
/* 좌우 넘김 표시: 오른쪽에 더 있으면 》, 왼쪽에 더 있으면 《 (반투명, 깜빡임) */
function edgeHints(sl,idx,n){
  const par=sl.parentElement; if(!par) return ()=>{};
  if(getComputedStyle(par).position==='static') par.style.position='relative';
  par.querySelectorAll(':scope>.eh').forEach(e=>e.remove());
  const L=document.createElement('span'),R=document.createElement('span');
  L.className='eh l';L.textContent='《';R.className='eh r';R.textContent='》';
  par.append(L,R);
  return ()=>{ const i=idx(), t=(sl.offsetTop+(sl.classList.contains('slider')?Math.min(48,sl.offsetHeight/2):sl.offsetHeight/2))+'px'; L.style.top=R.style.top=t; L.hidden=i<=0; R.hidden=i>=n-1; };
}
/* 세로 넘김 표시: 위에 더 있으면 ∧, 아래에 더 있으면 ∨ (반투명, 깜빡임) */
function mkEv(host,fixed){
  const U=document.createElement('span'),D=document.createElement('span');
  U.className='ev u'+(fixed?' fx':'');D.className='ev d'+(fixed?' fx':'');
  U.innerHTML='<i>《</i>';D.innerHTML='<i>》</i>';U.hidden=D.hidden=true;
  host.append(U,D); return [U,D];
}
function vHints(sc){
  const host=sc.parentElement; if(!host) return;
  if(getComputedStyle(host).position==='static') host.style.position='relative';
  host.querySelectorAll(':scope>.ev').forEach(e=>e.remove());
  const [U,D]=mkEv(host,false);
  const upd=()=>{ U.style.top=(sc.offsetTop+2)+'px'; D.style.top=(sc.offsetTop+sc.offsetHeight-34)+'px';
    U.hidden=sc.scrollTop<=8; D.hidden=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-8; };
  sc.addEventListener('scroll',upd,{passive:true}); upd(); setTimeout(upd,300);
  return upd;
}
(function(){
  let U,D;
  const upd=()=>{ if(!U) return; const de=document.documentElement, fit=getComputedStyle(de).overflow==='hidden';
    const y=window.scrollY, tot=de.scrollHeight, vh=window.innerHeight;
    U.hidden=fit||y<=8; D.hidden=fit||y+vh>=tot-8; };
  window.addEventListener('DOMContentLoaded',()=>{ [U,D]=mkEv(document.body,true); upd(); });
  window.addEventListener('scroll',upd,{passive:true}); window.addEventListener('resize',upd); window.addEventListener('hashchange',()=>{ setTimeout(upd,60); setTimeout(upd,400); });
  window.pageHints=upd;
})();
function initMeaning(){ setupPager('m'); }

const PQ_BASE=[20,14,8];
const pqPts=(stage,wrong)=>Math.max(2,PQ_BASE[stage]-wrong*4);
function pqBig(p){ const t=p.replace(/\s/g,''), r=new Set(); for(let i=0;i<t.length-1;i++) r.add(t.slice(i,i+2)); return r; }
function pqMake(pool,used,big){
  const withImg=pool.filter(x=>x.i&&!used.has(x.id)), rest=pool.filter(x=>!x.i&&!used.has(x.id));
  const src=withImg.length?withImg:rest; if(!src.length) return null;
  const it=src[Math.random()*src.length|0], a=pqBig(it.p), nrm=t=>t.replace(/\s/g,'');
  const keys=[...new Set(it.k.flatMap(k=>k.split(' ')).filter(w=>w.length>=2))];
  const jac=(x,y)=>{ let n=0; x.forEach(b=>{ if(y.has(b)) n++; }); return n/Math.max(1,x.size+y.size-n); };
  const cand=(big&&big.length?big:pool.map(o=>({t:o.p}))).map(o=>o.t).filter(t=>nrm(t)!==nrm(it.p));
  /* 정답의 변형(거의 같은 말)은 보기에서 뺀다 */
  const ok=cand.filter(t=>jac(a,pqBig(t))<.42&&!(keys.length>1&&keys.every(w=>t.includes(w))));
  const same=gmShuf(ok.filter(t=>keys.some(w=>t.includes(w)))), picked=[];
  const want=Math.random()<.5?1:2;
  const add=t=>{ if(picked.length<3&&!picked.includes(t)&&picked.every(x=>jac(pqBig(x),pqBig(t))<.42)) picked.push(t); };
  same.slice(0,40).forEach(t=>{ if(picked.length<want) add(t); });
  const sim=ok.map(t=>{ let n=0; pqBig(t).forEach(b=>{ if(a.has(b)) n++; }); return [t,n+Math.random()*1.5]; }).sort((x,y)=>y[1]-x[1]).slice(0,30).map(x=>x[0]);

function initEmoji(){
  const eb=document.getElementById('eb'); if(!eb) return;
  const alive=()=>!!document.getElementById('gmz');
  const G={n:0,total:0,res:[],combo:0,maxCombo:0};
  function intro(){

    eb.innerHTML=`<div class="gintro egintro"><div class="gi-ttl">🎭 이모지 속담 게임</div>

    }).catch(()=>{ eb.innerHTML='<div class="fmsg">문제를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>'; });

  function question(q){

      <div class="gprog">${[1,2,3,4,5].map(i=>`<i class="${i<G.n?'d':i===G.n?'c':''}"></i>`).join('')}</div>
      ${G.combo>=2?`<div class="egcombo">🔥 ${G.combo}연속 정답 중!</div>`:''}
      <div class="egcard" id="egcard"><div class="egem">${egSplit(q.e).map((x,i)=>`<span style="animation-delay:${i*.18}s">${x}</span>`).join('')}</div>
        <div class="egq">작은 그림들이 뜻하는 내용을 연결하여 속담을 찾아보세요</div></div>
      <div class="egop">${opts.map((o,i)=>`<button type="button" class="eop" data-i="${i}"><i>${'①②③④'[i]}</i><span>${esc(o.t)}</span></button>`).join('')}</div><div id="egfb"></div>`;
    const bs=[...eb.querySelectorAll('.eop')], fb=document.getElementById('egfb'), card=document.getElementById('egcard'), hh=document.getElementById('egh');
    const fin=(pts,ok)=>{
      done=true; G.total+=pts; G.res.push({q,pts});

      fb.innerHTML=`<div class="egfb ${ok?'ok':'no'}"><div class="egfh">${ok?(pts===20?'🎉 딱 맞혔어요! <u>+20점</u>':'👍 두 번째에 맞혔어요! <u>+10점</u>'):'😮 아깝다! 정답은 이 속담이에요.'}</div>${cm}
        <div class="egans">${esc(q.t)}</div><p>🔎 <b>이모지 풀이</b> ${esc(q.r)}</p><p>📖 <b>뜻</b> ${esc(q.m)}</p>
        <button type="button" class="cta pv" id="enx">${G.n>=5?'🏆 결과 보기':'다음 문제 ›'}</button></div>`;
      document.getElementById('enx').onclick=()=>{ gmSnd('x'); next(); };
      const sc=eb.querySelector('.gtot b'); if(sc) sc.textContent=G.total;
      if(ok){ egFx('⭕',pts===20?'정답! +20':'정답! +10','ok'); egBurst(pts===20?['🎉','⭐','✨','🎊','💮']:['⭐','✨'],pts===20?26:12); }
      else egFx('❌','땡! 정답은…','no');
      setTimeout(()=>{ if(alive()) fb.scrollIntoView({block:'center',behavior:'smooth'}); },700);
    };
    bs.forEach(b=>b.onclick=()=>{
      if(done) return; const o=opts[+b.dataset.i];
      if(o.ok){ b.classList.add('right'); gmSnd('ok'); try{navigator.vibrate&&navigator.vibrate(30);}catch(e){} fin(tries===0?20:10,true); }
      else { tries++; b.classList.add('bad'); b.disabled=true; gmSnd('no'); try{navigator.vibrate&&navigator.vibrate([40,40,40]);}catch(e){}
        card.classList.remove('shk','hop'); void card.offsetWidth; card.classList.add('shk');
        if(tries>=2){ hh.innerHTML='💔💔'; fin(0,false); }
        else { hh.innerHTML='❤️<i class="brk">💔</i>'; egFx('💔','앗! 한 번 더!','try'); fb.innerHTML='<div class="egtry">🤔 아니에요! <b>한 번 더</b> 골라 봐요. (맞히면 10점)</div>'; } }
    });
  }
  function result(){
    const t=G.total, st=egLoad(), prev=st.best;
    egSave({...st,best:Math.max(prev||0,t),tries:(st.tries||0)+1,seen:[...(st.seen||[]),...G.set.map(q=>q.id)].slice(-60)});
    const T=t>=100?['🏆','속담 천재','이모지만 봐도 속담이 척척! 대단해요!']:t>=80?['🥇','속담 척척이','거의 다 맞혔어요! 만점이 코앞이에요.']:t>=60?['🥈','속담 눈치꾼','눈치가 빨라요! 조금만 더 하면 척척이!']:t>=40?['🌱','속담 새싹','좋아요! 속담이 쑥쑥 자라고 있어요.']:['🌰','속담 씨앗','괜찮아요! 다시 하면 더 잘할 수 있어요.'];
    const tease=prev===undefined?'':t>prev?`🎉 신기록! 이전 최고 ${prev}점을 넘었어요!`:t===prev?'최고 기록과 똑같아요!':`최고 기록 ${prev}점까지 ${prev-t}점!`;
    document.getElementById('gmz').classList.add('res'); eb.innerHTML=`<div class="egres"><div class="egrt"><span>${T[0]}</span><b>${T[1]}</b><small>${T[2]}</small></div>
      <div class="gr-sc"><b>${t}</b><i>/ 100점</i></div>${tease?`<div class="egte">${tease}</div>`:''}${G.maxCombo>=2?`<div class="egte c">🔥 최고 ${G.maxCombo}연속 정답!</div>`:''}
      <ul class="egls">${G.res.map((r,i)=>`<li class="${r.pts?'y':'n'}"><span class="no">${i+1}</span><span class="em">${esc(r.q.e)}</span><span class="tx">${esc(r.q.t)}</span><span class="pt">${r.pts}점</span></li>`).join('')}</ul>
      <div class="gr-bt"><button class="cta pv" id="eag">🔁 다시 하기 <small>(새로운 문제)</small></button><button class="gr-sub" data-go="p-quiz">‹ 실력 키우기 메뉴</button></div></div>`;
    gmSnd(t>=60?'end':'no'); window.scrollTo(0,0); if(t>=60) egBurst(['🎉','⭐','✨','🎊','🌟','💮'],t>=100?46:26);
    document.getElementById('eag').onclick=start;
  }
  intro();
}

const lxStore=k=>({get(){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return [];}},add(id){try{const a=this.get();if(!a.includes(id)){a.push(id);localStorage.setItem(k,JSON.stringify(a));}}catch(e){}}});
const jong=w=>{const c=w.charCodeAt(w.length-1)-0xAC00; return (c<0||c>11171)?0:c%28;};
function josaFix(s,w,a){
  const jg=jong(a);
  const re=new RegExp('\\[\\['+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]\\](이었|였|이에요|예요|으로|로|이|가|을|를|은|는|와|과)?');
  return s.replace(re,(m,j)=>{
    let t=j||'';
    if(/^(이|가)$/.test(t)) t=jg?'이':'가';
    else if(/^(을|를)$/.test(t)) t=jg?'을':'를';
    else if(/^(은|는)$/.test(t)) t=jg?'은':'는';
    else if(/^(와|과)$/.test(t)) t=jg?'과':'와';
    else if(/^(으로|로)$/.test(t)) t=(jg===0||jg===8)?'로':'으로';
    else if(/^(이었|였)$/.test(t)) t=jg?'이었':'였';
    else if(/^(이에요|예요)$/.test(t)) t=jg?'이에요':'예요';
    return a+t;
  }).replace(/\[\[(.+?)\]\]/g,'$1')
   .replace('올리기했어요','올렸어요').replace('내려받기했어요','내려받았어요').replace('괴롭힘하면','괴롭히면').replace('다걸기했어요','다걸기를 했어요');
}

  function question(q){

    let tries=0, done=false;
    eb.innerHTML=`<div class="egtop"><span class="gn">문제 <b>${G.n}</b>/5</span><span class="egheart" id="egh">❤️❤️</span><span class="gtot">누적 <b>${G.total}</b>점</span></div>

    const bs=[...eb.querySelectorAll('.eop')], fb=document.getElementById('egfb'), card=document.getElementById('egcard'), hh=document.getElementById('egh');

      fb.innerHTML=`<div class="egfb ${ok?'ok':'no'}"><div class="egfh">${ok?(pts===20?'🎉 딱 맞혔어요! <u>+20점</u>':'👍 두 번째에 맞혔어요! <u>+10점</u>'):'😮 아깝다! 알맞은 우리말은 이거예요.'}</div>${cm}

    const tease=prev===undefined?'':t>prev?`🎉 신기록! 이전 최고 ${prev}점을 넘었어요!`:t===prev?'최고 기록과 똑같아요!':`최고 기록 ${prev}점까지 ${prev-t}점!`;

  const choose=()=>fitChoices(T,(x,i)=>tileHtml(x,i,PALT[i%6],x.e,x.k,`순우리말 ${x.ids.length}개`),3,i=>{
    fitPager(T,i,rW(null),j=>lists[j]||(lists[j]=T[j].ids.map(id=>by[id]).filter(Boolean).sort(byKo)),
      (x,j)=>({e:x.e,name:x.k,cnt:`순우리말 ${(lists[j]||[]).length}개`}),choose);
  });
  Promise.all([loadWtags(),loadWords()]).then(([t,a])=>{ T=t; by=byIdMap(a); choose(); }).catch(()=>fitMsg(LOADFAIL));
}

/* ---------- 라우팅 (#이름) ---------- */
let aboutT=null;
function startAbout(){
  clearInterval(aboutT); const a=document.getElementById('ab0'), b=document.getElementById('ab1'); if(!a||!b) return;
  let k=0; aboutT=setInterval(()=>{ if(!document.getElementById('ab0')){ clearInterval(aboutT); return; } k^=1; a.classList.toggle('on',!k); b.classList.toggle('on',!!k); },10000);
}
function route(){
  let h = (location.hash||'').slice(1) || 'home';
  if(h==='p-media') h='p-video'; if(h==='w-media') h='w-video';
  if(leafIndex[h]&&leafIndex[h].to) h=leafIndex[h].to;
  let html;
  if(h==='home') html=viewHome();
  else if(MENU[h]) html=viewHub(h);
  else if(groupIndex[h]) html=viewGroup(h);
  else if(leafIndex[h]) html=viewLeaf(h);
  else if(h==='help') html=viewHelp();
  else if(h==='status') html=viewStatus();
  else html=viewHome();
  $app.innerHTML = html;
  if(!MENU[h]&&h!=='home') applyTint(h);
  window.scrollTo(0,0);
  hideExit(); tagState(); if(needGuard()) guardPending=true;
  const lf=leafIndex[h]; if(lf && lf.status==='done' && lf.init) lf.init();
  clearInterval(aboutT); if(h==='home') startAbout();
  setTimeout(()=>window.pageHints&&window.pageHints(),80);
}
/* ---------- 첫 화면에서 뒤로 가기: 항상 종료 확인 ----------
   기록 쌓기: [E 첫 화면][G 보호 칸][이후 화면…]. 첫 화면에서 뒤로 가면 E가 되어 안내 창이 뜨고, 한 번 더 누르면 앱이 닫힌다.
   '처음'을 누르면 쌓인 화면을 한꺼번에 건너뛰어 G로 돌아오므로 항상 같은 흐름이 된다.
   (보호 칸은 사용자가 화면을 한 번 만진 뒤에 만든다 — 만지기 전에 쌓은 칸은 안드로이드가 건너뛴다) */
let guardPending=false, gN;
const isHome=()=>{ const h=(location.hash||'').slice(1); return h===''||h==='home'; };
const stN=()=>((history.state&&history.state.n)||0);
function tagState(){
  try{ const st=history.state||{};
    if(st.n===undefined){ const prev=window.__lastN===undefined?-1:window.__lastN; history.replaceState({...st,n:prev+1,b:gN},''); }
    window.__lastN=history.state.n; if(history.state.b!==undefined) gN=history.state.b;
  }catch(e){}
}
const needGuard=()=>isHome()&&!(history.state&&(history.state.home||history.state.g));
function doGuard(){
  try{ const n=stN(); gN=n+1; history.replaceState({home:1,n,b:gN},''); history.pushState({g:1,n:n+1,b:gN},''); window.__lastN=n+1; }catch(e){}
}
['pointerup','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(guardPending&&needGuard()){ guardPending=false; doGuard(); } },true));
function hideExit(){ const d=document.getElementById('exitdlg'); if(d) d.remove(); }
function showExit(){
  if(document.getElementById('exitdlg')) return;
  const d=document.createElement('div'); d.id='exitdlg'; d.setAttribute('role','dialog');
  d.innerHTML='<div class="exbox"><div class="exem">👋</div><b>한 번 더 누르면 종료돼요</b><small>뒤로 가기를 한 번 더 누르면 앱이 닫혀요.</small><button type="button" id="exgo">계속하기</button></div>';
  document.body.appendChild(d);
  document.getElementById('exgo').onclick=()=>{ hideExit(); try{ const n=stN(); history.pushState({g:1,n:n+1,b:gN},''); window.__lastN=n+1; }catch(e){} };
}
window.addEventListener('popstate',e=>{ if(e.state&&e.state.home&&isHome()) showExit(); else hideExit(); });

function go(id){
  if(id==='home'){ const st=history.state||{};
    if(isHome()) { route(); return; }
    if(st.b!==undefined && st.n>st.b){ history.go(st.b-st.n); return; } }
  if(location.hash==='#'+id) route(); else location.hash = id; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
window.addEventListener('hashchange',route);
route();

/* ---------- 앱 설치 ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
document.addEventListener('click',e=>{
  if(e.target.closest('#installBtn') && deferredPrompt){
    e.stopImmediatePropagation();
    deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;});
  }
},true);
if('serviceWorker' in navigator){
  let hadSW=!!navigator.serviceWorker.controller, rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadSW&&!rl){ rl=true; location.reload(); } hadSW=true; });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ r.update().catch(()=>{}); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) r.update().catch(()=>{}); }); }).catch(()=>{}); });
}
