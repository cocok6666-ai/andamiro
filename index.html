<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안다미로 - 속담과 순우리말</title>
<meta name="theme-color" content="#B9482F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안다미로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EA; --paper2:#F3EAD3; --ink:#2B2A28; --mute:#7A7468; --line:#E3D8BE;
  --pv:#B9482F; --pv-soft:#F6DDD3; --pv-deep:#8A3220;
  --wd:#23766F; --wd-soft:#D5EBE7; --wd-deep:#15524D;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --display:'Jua','Gowun Dodum','Noto Sans KR',sans-serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
body{min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
.screen{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:44px}
.back{width:44px;height:44px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:20px;flex:none}
.crumb{font-size:13px;color:var(--mute);line-height:1.3}
.crumb b{font-family:var(--display);font-weight:400;display:block;color:var(--ink);font-size:15px;font-weight:700}

/* home */
.hero{text-align:center;padding:26px 0 22px}
.bowl{display:block;width:168px;height:168px;margin:0 auto 2px;object-fit:contain}
.hero h1{font-family:var(--display);font-size:60px;letter-spacing:.04em;font-weight:400;line-height:1.1;color:#1F6F68}
.hero .hanja-line{font-size:13px;color:var(--mute);margin-top:8px}
.hero .def{font-family:var(--serif);font-size:16px;margin-top:14px;color:#4a463e}
.hero .def b{color:var(--pv)}
.mains{display:grid;gap:14px;margin-top:10px}
.main{position:relative;border-radius:22px;padding:22px 20px 20px;color:#fff;overflow:hidden;min-height:150px;display:block;width:100%;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .1s, box-shadow .1s}
.main:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.main.pv{background:linear-gradient(135deg,#C9553A,#A63C26)}
.main.wd{background:linear-gradient(135deg,#2E8B83,#1B625C)}
.main small{display:block;font-size:12px;opacity:.85;letter-spacing:.08em}
.main h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.25;margin:4px 0 8px}
.main p{font-size:14px;opacity:.95;max-width:78%}
.main .big{position:absolute;right:-6px;bottom:-22px;font-family:var(--display);font-size:112px;font-weight:400;opacity:.16;line-height:1;pointer-events:none}
.main .go{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:18px}
.homefoot{display:flex;gap:10px;margin-top:20px}
.pill{flex:1;padding:12px 10px;border-radius:14px;background:var(--paper2);font-size:14px;text-align:center;font-weight:500}

/* hub */
.hubhead{border-radius:20px;padding:20px;color:#fff;margin-bottom:18px}
.hubhead.pv{background:linear-gradient(135deg,#C9553A,#A63C26)}
.hubhead.wd{background:linear-gradient(135deg,#2E8B83,#1B625C)}
.hubhead h2{font-family:var(--display);font-weight:400;font-size:28px}
.hubhead p{font-size:14px;opacity:.95;margin-top:4px}
.goals{margin:0 0 18px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.goals h3{font-size:13px;color:var(--mute);margin-bottom:6px;letter-spacing:.06em}
.goals li{font-size:14px;margin-left:18px;padding:1px 0}
.group{margin-bottom:18px}
.group h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 2px 8px;display:flex;align-items:baseline;gap:8px}
.group h3 span{font-family:var(--sans);font-size:12px;color:var(--mute);font-weight:400}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px;margin-bottom:8px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:56px}
.item:active{background:var(--paper2)}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.pv .ic,.ic.pv{background:var(--pv-soft)} .wd .ic,.ic.wd{background:var(--wd-soft)}
.item .t{flex:1;font-weight:500;line-height:1.35}
.item .t small{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:1px}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--paper2);color:var(--mute);flex:none}
.tag.ok{background:#DDF0D6;color:#2F6B1F}

/* leaf */
.leaf h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.3;margin-bottom:6px}
.leaf .lead{color:#4a463e;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h3{font-size:13px;color:var(--mute);letter-spacing:.06em;margin-bottom:8px}
.panel li{margin-left:18px;padding:2px 0;font-size:15px}
.soon{display:flex;gap:12px;align-items:center;padding:16px;border-radius:16px;border:2px dashed var(--line);color:var(--mute);margin-bottom:14px}
.soon .em{font-size:28px}
.soon b{color:var(--ink);display:block}
.cta{width:100%;padding:15px;border-radius:14px;color:#fff;font-weight:700;text-align:center;margin-top:6px}
.cta.pv{background:var(--pv)} .cta.wd{background:var(--wd)}

/* simple pages */
.doc h2{font-family:var(--display);font-weight:400;font-size:28px;margin-bottom:12px}
.doc h3{font-size:15px;margin:16px 0 6px}
.doc p,.doc li{font-size:15px}
.doc ul{margin-left:20px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500;font-size:12px}
.bar2{height:8px;background:var(--paper2);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar2 i{display:block;height:100%;background:var(--wd)}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   안다미로 - 메뉴 트리 (여기에 내용을 하나씩 채워 넣는다)
   leaf.status: 'todo'(준비중) | 'done'(완성)  /  leaf.render: 완성된 화면 함수(선택)

const MENU = {
  proverb:{
    cls:'pv', title:'재미있는 속담이야기', short:'속담', icon:'📜',

        {id:'p-origin', ic:'🏺', title:'속담의 유래', desc:'속담이 만들어진 다양한 이야기를 공부해요.', plan:['유래가 재미있는 속담 이야기','유래 이야기 읽고 뜻 맞혀 보기']},
        {id:'p-good', ic:'✨', title:'속담의 좋은 점', desc:'속담을 쓰면 말이 어떻게 달라지는지 알아봐요.', plan:['간결한 · 비유적인 · 다채로운 · 교훈적인 · 통속적인 표현','같은 상황을 속담으로 말했을 때와 보통 말로 했을 때 비교']},
        {id:'p-books', ic:'📚', title:'속담을 전하는 책들', desc:'조선시대부터 속담을 전해 온 책을 소개해요.', plan:['속담을 기록한 옛 책 소개','책 표지·시대·특징 카드']}
      ]},
      {id:'p-school', title:'속담 배움터', note:'초등 3~6학년 교과 속담', items:[
        {id:'p-g3', ic:'3️⃣', title:'3학년 교과 내용', desc:'3학년 교과에 나오는 속담을 단원별로 배워요.', plan:['교과 단원 안내','설명 자료 · 이미지 · 멀티미디어 학습 화면']},
        {id:'p-g4', ic:'4️⃣', title:'4학년 교과 내용', desc:'4학년 교과에 나오는 속담을 단원별로 배워요.', plan:['교과 단원 안내','설명 자료 · 이미지 · 멀티미디어 학습 화면']},
        {id:'p-g5', ic:'5️⃣', title:'5학년 교과 내용', desc:'5학년 교과에 나오는 속담을 단원별로 배워요.', plan:['교과 단원 안내','설명 자료 · 이미지 · 멀티미디어 학습 화면']},
        {id:'p-g6', ic:'6️⃣', title:'6학년 교과 내용', desc:'6학년 교과에 나오는 속담을 단원별로 배워요.', plan:['교과 단원 안내','설명 자료 · 이미지 · 멀티미디어 학습 화면']}
      ]},
      {id:'p-media', title:'속담 자료 모음', note:'', items:[
        {id:'p-video', ic:'🎬', title:'동영상 자료', desc:'30여 편의 속담 영상을 모아서 보아요.', plan:['속담 영상 목록','영상 시청 후 한 줄 생각 남기기']}
      ]},
      {id:'p-use', title:'속담 활용', note:'속담으로 표현하기', items:[
        {id:'p-family', ic:'🏠', title:'속담으로 가훈 만들기', desc:'속담을 골라 우리 집 가훈을 만들어 봐요.', plan:['예시 가훈 살펴보기','속담 고르기 → 가훈 꾸미기','완성한 가훈 공유하며 다짐하기']},
        {id:'p-motto', ic:'🎯', title:'속담으로 좌우명 만들기', desc:'나를 이끄는 한마디, 좌우명을 만들어 봐요.', plan:['예시 좌우명 살펴보기','속담 고르기 → 나의 좌우명 꾸미기']},
        {id:'p-remix', ic:'🎨', title:'재미있게 속담 고치기', desc:'요즘 상황에 어울리게 속담을 바꿔 봐요.', plan:['속담의 일부를 바꿔 새 속담 만들기','바꾼 속담에 담긴 뜻 설명하기']},
        {id:'p-box', ic:'🧺', title:'내 속담 창고', desc:'내가 고치고 만든 속담이 차곡차곡 쌓이는 곳이에요.', plan:['만든 가훈·좌우명·속담 모아 보기','누적된 학습 결과물 보기']}
      ]},
      {id:'p-find', title:'속담 찾기', note:'속담사전 · 1만 개 이상', items:[
        {id:'p-f-word', ic:'🔤', title:'낱말로 찾기', desc:'속담 속 낱말만 입력해도 찾아져요.', plan:['검색어 입력','검색 결과 목록 → 속담 뜻풀이']},
        {id:'p-f-nature', ic:'🌿', title:'동식물로 찾기', desc:'동물·식물 이름으로 속담을 찾아요.', plan:['동식물 이름 입력 또는 고르기','검색 결과 목록 → 속담 뜻풀이']},
        {id:'p-f-moral', ic:'🧭', title:'교훈으로 찾기', desc:'교훈·덕목·상징하는 낱말로 찾아요.', plan:['교훈/덕목 고르기','검색 결과 목록 → 속담 뜻풀이']},
        {id:'p-f-zodiac', ic:'🐯', title:'나의 띠로 속담 찾기', desc:'내 띠 동물이 나오는 속담을 찾아요.', plan:['띠 고르기','띠 동물 속담 목록 → 속담 뜻풀이']}
      ]},
      {id:'p-quiz', title:'속담 실력 알아보기', note:'평가', items:[
        {id:'p-q-fill', ic:'🧩', title:'속담 완성하기', desc:'빈칸을 채워 속담을 완성해요.', plan:['빈칸 채우기 문제','정답과 뜻 확인']},
        {id:'p-q-test', ic:'📝', title:'시험지 형식으로 알아보기', desc:'문제은행에서 뽑은 문제로 실력을 확인해요.', plan:['교과 기반 문제 풀기','결과 화면 + 공유(피드백)']},
        {id:'p-q-pic', ic:'🖼️', title:'그림퀴즈 형식으로 알아보기', desc:'그림을 보고 낱말 버튼으로 속담을 만들어요.', plan:['그림 보고 떠올리기','낱말 버튼을 눌러 속담 완성']}

  },
  words:{
    cls:'wd', title:'아름다운 순우리말', short:'우리말', icon:'🌸',

    goals:[
      '우리말의 우수성을 알고 적절한 상황에 사용할 수 있다.',
      '순우리말을 이용한 표현을 할 수 있다.',
      '자주 쓰지 않던 아름다운 우리말을 친구들에게 소개할 수 있다.',
      '찾고자 하는 우리말을 검색어로 쉽게 찾을 수 있다.'
    ],
    groups:[
      {id:'w-find', title:'우리말 찾기', note:'1,550여 개 · 초등 수준', items:[
        {id:'w-f-char', ic:'🔡', title:'글자로 찾기', desc:'글자 단위로 검색해 자유롭게 찾아봐요. 처음 시작하는 친구에게 알맞아요.', plan:['글자 입력(예: “나”가 들어간 우리말)','검색 결과 목록 → 낱말 뜻풀이']},
        {id:'w-f-cat', ic:'🗂️', title:'분류하여 찾기', desc:'분류를 한 번 눌러 관련 우리말을 모아 봐요.', plan:['분류 고르기(예: 날씨)','분류별 낱말 목록 → 낱말 뜻풀이']}
      ]},
      {id:'w-right', title:'우리말 바로 쓰기', note:'', items:[
        {id:'w-fix', ic:'🔁', title:'꼭! 우리말로 바꿔주세요', desc:'잘못 쓰는 외국어·파생어·신조어를 우리말로 바꿔 봐요.', plan:['순화어 목록','바꿔 쓴 말 예문 살펴보기']},
        {id:'w-tricky', ic:'⚠️', title:'틀리기 쉬운 우리말 모음', desc:'헷갈리기 쉬운 말을 바르게 익혀요.', plan:['혼동하기 쉬운 말 비교','꼭 외워 둘 말 카드']}
      ]},
      {id:'w-check', title:'우리말 나의 실력 확인하기', note:'평가', items:[
        {id:'w-q-fix', ic:'✏️', title:'우리말로 바꾸기', desc:'알맞은 우리말로 고쳐 쓰는 문제예요.', plan:['고쳐 쓰기 문제','정답 확인']},
        {id:'w-q-pic', ic:'🖼️', title:'그림보고 우리말 맞추기', desc:'그림으로 우리말의 뜻을 짐작해 맞혀요.', plan:['그림 보고 낱말 고르기','정답과 뜻 확인']},
        {id:'w-q-test', ic:'🏅', title:'나의 우리말 실력은?', desc:'20문항으로 종합 평가를 해 봐요.', plan:['종합 평가 20문항','평가 결과 화면']}
      ]},
      {id:'w-media', title:'우리말 영상', note:'', items:[
        {id:'w-video', ic:'🎬', title:'우리말 영상 자료 보기', desc:'우리말 이야기 영상을 모아서 보아요.', plan:['영상 목록','영상 시청 후 한 줄 생각 남기기']}
      ]}
    ]
  }
};

/* ---------- 도우미 ---------- */
const $app = document.getElementById('app');
const leafIndex = {}, hubOf = {};
Object.entries(MENU).forEach(([k,m])=>m.groups.forEach(g=>g.items.forEach(it=>{leafIndex[it.id]=it;hubOf[it.id]=k;it.status=it.status||'todo';})));
const allLeaves = Object.values(leafIndex);
const doneCount = a => a.filter(i=>i.status==='done').length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


function bar(backTo, top, bottom){
  return `<div class="bar"><button class="back" data-go="${backTo}" aria-label="뒤로">‹</button><div class="crumb">${esc(top)}<b>${esc(bottom)}</b></div></div>`;
}

/* ---------- 화면 ---------- */
function viewHome(){
  return `<div class="screen">
    <div class="hero"><img class="bowl" src="icons/hero.png" alt="우리말 글자가 머릿속에서 넘쳐 나오는 모습"><h1>안다미로</h1>
      <div class="hanja-line">속담 · 순우리말 배움터</div>
      <div class="def"><b>안다미로</b> : 담은 것이 넘칠 듯이 가득한 모양</div></div>
    <div class="mains">
      <button class="main pv" data-go="proverb"><span class="go">›</span><small>하나</small><h2>재미있는<br>속담이야기</h2><p>옛사람의 지혜가 담긴 속담을 배우고 만들어요</p><span class="big">속</span></button>
      <button class="main wd" data-go="words"><span class="go">›</span><small>둘</small><h2>아름다운<br>순우리말</h2><p>곱고 정겨운 우리말을 찾고 익혀요</p><span class="big">말</span></button>
    </div>
    <div class="homefoot"><button class="pill" data-go="help">📖 사용법 안내</button><button class="pill" data-go="status">🛠 제작 현황</button></div>
    <button class="pill" id="installBtn" data-go="help" style="width:100%;margin-top:10px;background:var(--pv);color:#fff;font-weight:700">📲 앱으로 설치하기</button>
  </div>`;
}

function viewHub(k){
  const m = MENU[k];
  const groups = m.groups.map(g=>`<section class="group ${m.cls}">
    <h3>${esc(g.title)} ${g.note?`<span>${esc(g.note)}</span>`:''}</h3>
    ${g.items.map(it=>`<button class="item" data-go="${it.id}"><span class="ic">${it.ic}</span><span class="t">${esc(it.title)}<small>${esc(it.desc)}</small></span>${it.status==='done'?'<span class="tag ok">완성</span>':'<span class="tag">준비 중</span>'}</button>`).join('')}
  </section>`).join('');
  return `<div class="screen">${bar('home','안다미로',m.short)}
    <div class="hubhead ${m.cls}"><h2>${m.icon} ${esc(m.title)}</h2><p>${esc(m.sub)}</p></div>
    <div class="goals"><h3>학습 목표</h3><ul>${m.goals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${groups}</div>`;
}

function viewLeaf(id){
  const it = leafIndex[id], k = hubOf[id], m = MENU[k];
  if(it.status==='done' && typeof it.render==='function'){
    return `<div class="screen">${bar(k,m.title,it.title)}${it.render()}</div>`;
  }
  const g = m.groups.find(g=>g.items.includes(it));
  return `<div class="screen leaf">${bar(k,m.title+' › '+g.title,it.title)}
    <h2>${it.ic} ${esc(it.title)}</h2><p class="lead">${esc(it.desc)}</p>
    <div class="soon"><span class="em">🌱</span><div><b>이 메뉴는 준비 중이에요</b>곧 알찬 내용으로 채워질 예정이에요.</div></div>
    <div class="panel"><h3>구성 예정</h3><ul>${it.plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <button class="cta ${m.cls}" data-go="${k}">‹ ${esc(m.short)} 메뉴로 돌아가기</button></div>`;
}

function viewHelp(){
  return `<div class="screen doc">${bar('home','안다미로','사용법 안내')}
    <h2>📖 사용법 안내</h2>
    <h3>기본 사용법</h3>
    <ul><li>처음 화면에서 <b>재미있는 속담이야기</b> 또는 <b>아름다운 순우리말</b>을 눌러 시작해요.</li>
    <li>궁금한 메뉴를 누르면 학습 화면으로 이동해요.</li>
    <li>왼쪽 위 <b>‹</b> 단추로 언제든 앞 화면으로 돌아갈 수 있어요.</li></ul>
    <h3>앱으로 설치하기</h3>
    <ul><li><b>삼성 인터넷</b> : 오른쪽 아래 ☰ 메뉴 → <b>현재 페이지 추가</b> → <b>홈 화면</b></li>
    <li><b>크롬(안드로이드)</b> : 오른쪽 위 ⋮ 메뉴 → <b>홈 화면에 추가</b>(또는 앱 설치)</li>
    <li><b>아이폰 사파리</b> : 공유 단추 → <b>홈 화면에 추가</b></li>
    <li>설치하면 홈 화면의 안다미로 아이콘으로 바로 열 수 있어요.</li></ul>
    <h3>검색할 때</h3>
    <ul><li>검색창을 누르면 나오는 자판으로 낱말을 입력해요.</li><li>낱말 일부만 입력해도 찾을 수 있어요.</li></ul>
    <h3>기기별 안내</h3>
    <ul><li><b>스마트폰·태블릿</b> : 손가락으로 터치해요.</li><li><b>컴퓨터</b> : 마우스로 클릭하고 키보드로 입력해요.</li></ul>
    <div class="foot">안다미로 · 학생 교육용</div></div>`;
}

function viewStatus(){
  const rows = Object.entries(MENU).map(([k,m])=>{
    const ls = m.groups.flatMap(g=>g.items), d = doneCount(ls);
    return `<h3>${m.icon} ${esc(m.title)} — ${d}/${ls.length}</h3>
    <div class="bar2"><i style="width:${ls.length?d/ls.length*100:0}%"></i></div>
    <table><tr><th>메뉴</th><th>상태</th></tr>${m.groups.map(g=>`<tr><td colspan="2" style="color:var(--mute);font-size:12px;padding-top:12px">${esc(g.title)}</td></tr>`+g.items.map(it=>`<tr><td><a href="#${it.id}" style="color:inherit">${esc(it.title)}</a></td><td>${it.status==='done'?'✅ 완성':'⬜ 준비 중'}</td></tr>`).join('')).join('')}</table>`;
  }).join('');
  return `<div class="screen doc">${bar('home','안다미로','제작 현황')}
    <h2>🛠 제작 현황</h2><p>전체 ${doneCount(allLeaves)} / ${allLeaves.length} 메뉴 완성. 선생님·제작자용 화면이에요.</p>${rows}</div>`;
}

/* ---------- 라우팅 (#이름) ---------- */
function route(){
  const h = (location.hash||'').slice(1) || 'home';
  let html;
  if(h==='home') html=viewHome();
  else if(MENU[h]) html=viewHub(h);
  else if(leafIndex[h]) html=viewLeaf(h);
  else if(h==='help') html=viewHelp();
  else if(h==='status') html=viewStatus();
  else html=viewHome();
  $app.innerHTML = html;
  window.scrollTo(0,0);
}
function go(id){ if(location.hash==='#'+id) route(); else location.hash = id; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
window.addEventListener('hashchange',route);
route();

/* ---------- 앱 설치 ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
document.addEventListener('click',e=>{
  if(e.target.closest('#installBtn') && deferredPrompt){
    e.stopImmediatePropagation();
    deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;});
  }
},true);
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
