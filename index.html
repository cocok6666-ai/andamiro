<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안다미로 - 속담과 순우리말</title>
<meta name="theme-color" content="#1F6F68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192-3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안다미로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EA; --paper2:#F3EAD3; --ink:#2B2A28; --mute:#7A7468; --line:#E3D8BE;
  --pv:#B9482F; --pv-soft:#F6DDD3; --pv-deep:#8A3220;
  --wd:#23766F; --wd-soft:#D5EBE7; --wd-deep:#15524D;
  --display:'Jua','Noto Sans KR',sans-serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18.4px;line-height:1.6}
body{word-break:keep-all;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
.screen{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:44px}
.back{width:44px;height:44px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:23px;flex:none}
.crumb{font-size:14.9px;color:var(--mute);line-height:1.3}
.crumb b{font-family:var(--display);font-weight:400;display:block;color:var(--ink);font-size:17.2px;font-weight:700}

/* home */
.hero{text-align:center;padding:6px 0 18px}
.hero-art{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 18px rgba(15,74,69,.26))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero h1{font-family:var(--display);font-size:60px;letter-spacing:.04em;font-weight:400;line-height:1.1;color:#1F6F68}
.hero .hanja-line{font-size:14.9px;color:var(--mute);margin-top:8px}
.hero .def{font-family:var(--sans);font-size:18.4px;font-weight:500;margin-top:14px;color:#4a463e}
.hero .ex{word-break:keep-all;text-wrap:balance;font-family:var(--sans);font-size:16.1px;line-height:1.55;margin:10px 4px 0;padding:10px 14px;border-radius:14px;background:var(--paper2);color:#5b5548;text-align:left}
.hero .ex b{color:var(--pv);font-weight:700}
.hero .def b{color:var(--pv)}
.mains{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 -18px}
.main{position:relative;border-radius:0;padding:24px 10px 22px;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(28px,9dvh,90px);text-align:center;gap:14px;width:100%;min-height:max(260px,calc(100vh - min(100vw,560px)*.944 - 24px));min-height:max(260px,calc(100dvh - min(100vw,560px)*.944 - 24px));transition:filter .1s}
.main:active{filter:brightness(.92)}
.main.pv{background:linear-gradient(160deg,#C9553A,#A63C26)}
.main.wd{background:linear-gradient(160deg,#2E8B83,#1B625C)}
.main .ico{flex:none;width:92px;height:92px;border-radius:28px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--display);font-size:58px;line-height:1}
.main .mt{min-width:0}
.main h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.25;margin:0 0 8px}
.main p{font-size:15.5px;line-height:1.5;opacity:.95;word-break:keep-all;padding:0 4px}
.main .go{position:static;margin:4px 0 0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px}
.screen.home{margin-top:-18px}
.screen.home .hero{padding:0 0 8px}
.screen.home .hero-art{width:calc(100% + 36px);max-width:none;margin:0 -18px;border-radius:0 0 30px 30px}
.hero2{padding:14px 0 0!important}
.hero2 .def{margin-top:0;font-size:17px}
.hero2 .ex{margin-top:8px;font-size:15px}
.homefoot{display:flex;gap:10px;margin-top:20px}
.pill{flex:1;padding:12px 10px;border-radius:14px;background:var(--paper2);font-size:16.1px;text-align:center;font-weight:500}

/* hub */
.hubhead{border-radius:20px;padding:20px;color:#fff;margin-bottom:18px}
.hubhead.pv{background:linear-gradient(135deg,#C9553A,#A63C26)}
.hubhead.wd{background:linear-gradient(135deg,#2E8B83,#1B625C)}
.hubhead h2{font-family:var(--display);font-weight:400;font-size:27px;word-break:keep-all}
.hubhead p{word-break:keep-all;font-size:16.1px;opacity:.95;margin-top:4px}
.group{margin-bottom:18px}
.group h3{font-family:var(--display);font-weight:400;font-size:24.1px;margin:0 2px 8px;display:flex;align-items:baseline;gap:8px}
.group h3 span{font-family:var(--sans);font-size:13.8px;color:var(--mute);font-weight:400}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px;margin-bottom:8px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:56px}
.item:active{background:var(--paper2)}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20.7px;flex:none}
.pv .ic,.ic.pv{background:var(--pv-soft)} .wd .ic,.ic.wd{background:var(--wd-soft)}
.item .t{flex:1;font-weight:500;line-height:1.35}
.item .t small{display:block;font-weight:400;font-size:14.4px;color:var(--mute);margin-top:1px}
.tag{font-size:12.6px;padding:3px 8px;border-radius:99px;background:var(--paper2);color:var(--mute);flex:none}
.tag.ok{background:#DDF0D6;color:#2F6B1F}

/* leaf */
.leaf h2{font-family:var(--display);font-weight:400;font-size:34.5px;line-height:1.3;margin-bottom:6px}
.leaf .lead{color:#4a463e;margin-bottom:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h3{font-size:14.9px;color:var(--mute);letter-spacing:.06em;margin-bottom:8px}
.panel li{margin-left:18px;padding:2px 0;font-size:17.2px}
.soon{display:flex;gap:12px;align-items:center;padding:16px;border-radius:16px;border:2px dashed var(--line);color:var(--mute);margin-bottom:14px}
.soon .em{font-size:32.2px}
.soon b{color:var(--ink);display:block}
.cta{width:100%;padding:15px;border-radius:14px;color:#fff;font-weight:700;text-align:center;margin-top:6px}
.cta.pv{background:var(--pv)} .cta.wd{background:var(--wd)}

/* simple pages */
.doc h2{font-family:var(--display);font-weight:400;font-size:32.2px;margin-bottom:12px}
.doc h3{font-size:17.2px;margin:16px 0 6px}
.doc p,.doc li{font-size:17.2px}
.doc ul{margin-left:20px}
table{width:100%;border-collapse:collapse;font-size:16.1px;margin-top:6px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500;font-size:13.8px}
.bar2{height:8px;background:var(--paper2);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar2 i{display:block;height:100%;background:var(--wd)}

/* 속담 찾기 */
.sf-box{position:sticky;top:0;z-index:5;background:var(--paper);padding:2px 0 10px}
.sf-in{display:flex;gap:8px}
.sf-in input{flex:1;min-width:0;font:inherit;font-size:19.5px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
.sf-in input:focus{border-color:var(--pv)}
.sf-clear{width:48px;border-radius:14px;background:var(--paper2);text-align:center;font-size:20.7px}
.sf-opt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;background:var(--paper2);font-size:15.5px;font-weight:500}
.chip.on{background:var(--pv);color:#fff}
.sf-info{font-size:14.9px;color:var(--mute);margin:6px 2px 8px}
.sf-h{font-family:var(--display);font-weight:400;font-size:20.7px;margin:14px 2px 8px}
.pcard{display:block;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.pcard .pt{font-weight:700;font-size:19px;line-height:1.45;word-break:keep-all}
.pcard mark{background:#FFE08A;color:inherit;border-radius:3px;padding:0 1px}
.pcard .pm{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:16.7px;color:#4a463e;word-break:keep-all}
.pcard .ps{margin-top:8px;font-size:15.5px;color:var(--pv-deep);word-break:keep-all}
.pcard .ps b{font-weight:700}
.pcard.open{border-color:var(--pv);background:#FFFBF3}
.pcard.open .pm{display:block}
.pcard .lvb{float:right;font-size:12.6px;font-weight:500;color:var(--mute);background:var(--paper2);border-radius:99px;padding:1px 8px;margin-left:8px}
.more{width:100%;padding:13px;border-radius:14px;background:var(--paper2);text-align:center;font-weight:500;margin-top:4px}
.today{background:linear-gradient(135deg,#C9553A,#A63C26);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.today small{opacity:.85;font-size:13.8px;letter-spacing:.06em}
.today .pt{font-family:var(--display);font-size:25.3px;line-height:1.4;margin:4px 0 6px;word-break:keep-all}
.today .pm{font-size:16.1px;opacity:.96;word-break:keep-all}
.credit{margin-top:26px;font-size:13.2px;color:var(--mute);text-align:center;line-height:1.5}
.credit a{color:inherit}

/* 속담이란 */
.les h2{font-family:var(--display);font-weight:400;font-size:34.5px;line-height:1.3;margin-bottom:6px}
.les .lead{color:#4a463e;margin-bottom:14px}
.les .sec{font-family:var(--display);font-weight:400;font-size:24.1px;margin:22px 2px 10px}
.les .sec small{font-family:var(--sans);font-size:13.8px;color:var(--mute)}
.les p{word-break:keep-all}
.note2{font-size:16.1px;color:var(--mute);margin-bottom:10px}
.nm .split{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 12px}
.nm .split div{white-space:nowrap;text-align:center;background:var(--pv-soft);border-radius:14px;padding:10px 12px;min-width:84px}
.nm .split b{display:block;font-family:var(--display);font-weight:400;font-size:39.1px;line-height:1.1;color:var(--pv-deep)}
.nm .split small{font-size:13.8px;color:#5b5548;line-height:1.3;display:block}
.nm .split .res{background:var(--pv);} .nm .split .res b,.nm .split .res small{color:#fff}
.nm .plus{font-family:var(--display);font-size:27.6px;color:var(--mute)}
.nm p{font-size:17.2px}
.feat{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.fi{width:46px;height:46px;border-radius:14px;background:var(--pv-soft);display:grid;place-items:center;font-size:27.6px;flex:none}
.feat b,.cmp b{font-size:17.8px}
.feat p,.cmp .ch p{font-size:16.1px;color:#4a463e;margin-top:2px}
.eg{margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--paper2);font-size:15.5px;color:#4a463e;word-break:keep-all}
.eg b{color:var(--pv-deep)}
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 12px;-webkit-overflow-scrolling:touch}
.slider .story{flex:0 0 84%;scroll-snap-align:center;margin:0}
.story{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.story .sb{padding:12px 14px 14px}
.story h4{font-family:var(--display);font-weight:400;font-size:21.8px;line-height:1.4;color:var(--pv-deep);word-break:keep-all}
.story p,.story .ob{font-size:16.7px;margin-top:6px;word-break:keep-all}
.story .sn{font-size:13.2px;color:var(--mute)}
.story .sm{margin-top:9px;padding:9px 12px;border-radius:12px;background:var(--pv-soft);font-size:16.1px;color:#4a2a20;word-break:keep-all}
.story .sm b,.story .ob b{display:inline-block;font-size:13.2px;background:var(--pv);color:#fff;border-radius:99px;padding:0 8px;margin-right:4px}
.story .ob{line-height:1.65}
.hint{font-size:13.8px;color:var(--mute);margin-top:6px}
.story.sm1 .sb{padding:10px 14px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px}
.tabs .chip{flex:none;white-space:nowrap;padding:9px 14px}
.gdesc{margin:2px 2px 10px}
.gdesc b{font-family:var(--display);font-weight:400;font-size:23px}
.gdesc small{font-family:var(--sans);font-size:13.8px;color:var(--mute)}
.gdesc p{font-size:16.1px;color:#5b5548}
.cmp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.cmp .ch{display:flex;gap:12px}
.vs{display:grid;gap:6px;margin-top:10px}
.vs>div{border-radius:12px;padding:9px 12px;font-size:16.1px;word-break:keep-all}
.vs small{display:block;font-size:13.2px;color:var(--mute);margin-bottom:1px}
.vs .v1{background:var(--paper2);color:#4a463e}
.vs .v2{background:var(--pv-soft)} .vs .v2 b{color:var(--pv-deep);font-family:var(--display);font-weight:400;font-size:20.7px}
.scene{position:relative;height:96px;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.scene.big{height:132px}
.scene .se{font-size:46px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.scene.big .se{font-size:60px}
.scene .se1{transform:translateY(6px) rotate(6deg)}
.scene .se0{transform:rotate(-6deg)}
.scene .sp{position:absolute;font-style:normal;color:rgba(255,255,255,.85);font-size:18.4px}
.scene .s1{left:14%;top:14%} .scene .s2{right:12%;bottom:16%;font-size:25.3px}

/* 우리말 찾기 */
.wdscr .sf-in input:focus{border-color:var(--wd)}
.wdscr .chip.on{background:var(--wd)}
.wdscr .pcard.open{border-color:var(--wd);background:#F6FBFA}
.wdscr .today{background:linear-gradient(135deg,#2E8B83,#1B625C)}
.wdscr .pcard .pt small{font-weight:400;font-size:13.2px;color:var(--wd-deep);background:var(--wd-soft);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.wdscr .pcard.open .pq{display:none}
.wdscr .pm ol{margin-left:20px}
.wdscr .pm li{padding:1px 0}
.wdscr .pm .ex{margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--wd-soft);color:var(--wd-deep);font-size:15.5px}
.wdscr .pcard .pq{display:block;font-size:15.5px;color:var(--mute);font-weight:400;margin-top:1px;word-break:keep-all}
.jamo{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 6px}
.jamo button{text-align:center;padding:9px 0;border-radius:11px;background:#fff;border:1px solid var(--line);font-family:var(--display);font-size:21.8px}
.jamo button.on{background:var(--wd);color:#fff;border-color:var(--wd)}

/* 주제별 속담 찾기 (동식물 · 교훈 · 띠) */
.tbanner{position:relative;border-radius:22px;padding:20px 18px 18px;color:#fff;overflow:hidden;margin-bottom:14px}
.tbanner h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.25;position:relative}
.tbanner h2,.tbanner p{max-width:74%}
.tbanner p{font-size:15px;opacity:.95;margin-top:4px;position:relative;word-break:keep-all}
.tbanner .fl{position:absolute;font-size:38px;opacity:.32;pointer-events:none}
.tbanner .fl.a{right:12px;top:8px;font-size:54px;opacity:.5} .tbanner .fl.b{right:16px;bottom:6px;font-size:30px;opacity:.4} .tbanner .fl.c{display:none}
.nat .tbanner{background:linear-gradient(135deg,#3FA66B,#1E7A55 60%,#12583F)}
.mor .tbanner{background:linear-gradient(135deg,#F2A93B,#E0703C 55%,#B8483A)}
.zod .tbanner{background:linear-gradient(160deg,#2A2F78,#4B3A9A 60%,#7A4FB0);}
.zod .tbanner:before{content:"✦ ·  ✧  · ✦   ·  ✧ ·   ✦";position:absolute;left:14px;bottom:8px;color:rgba(255,255,255,.5);letter-spacing:10px;font-size:13px}
.seg{display:flex;gap:6px;background:var(--paper2);border-radius:99px;padding:5px;margin-bottom:14px}
.seg button{flex:1;text-align:center;padding:11px 0;border-radius:99px;font-weight:700;font-size:17px}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);color:#1E7A55}
.tgrid{display:grid;gap:10px;margin-bottom:6px}
.tgrid.c3{grid-template-columns:repeat(3,1fr)} .tgrid.c2{grid-template-columns:repeat(2,1fr)} .tgrid.c4{grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:18px;padding:12px 4px 10px;background:#fff;border:2px solid var(--line);transition:transform .12s,box-shadow .12s}
.tile:active{transform:scale(.94)}
.tile .te{font-size:38px;line-height:1.15}
.tile b{font-size:15.5px;margin-top:2px;word-break:keep-all}
.tile small{font-size:12px;color:var(--mute)}
.tile.on{transform:translateY(-3px);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.nat .tile .te{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--bg,#DDF0D6)}
.nat .tile.on{border-color:#2E9A63;background:#F0FAF4}
.mor .tile,.wcat .tile{align-items:flex-start;text-align:left;padding:14px 12px 12px;border:0;color:#2B2A28;background:linear-gradient(160deg,var(--c1),var(--c2));min-height:112px;box-shadow:0 4px 0 rgba(0,0,0,.10)}
.mor .tile .te{font-size:36px}
.mor .tile b{font-family:var(--display);font-weight:400;font-size:19px;margin-top:4px}
.mor .tile small{color:#4a463e;font-size:12.5px;margin-top:1px;word-break:keep-all}
.mor .tile em{font-style:normal;margin-top:auto;padding-top:6px;font-size:12px;font-weight:700;color:#5b3a1a}
.mor .tile.on{outline:3px solid #B8483A;outline-offset:1px}
.zod .tile{border-color:#D9D2F2;background:linear-gradient(180deg,#fff,#F2EEFC);padding:10px 2px 8px}
.zod .tile .te{font-size:34px} .zod .tile b{font-size:14.5px}
.zod .tile.on{border-color:#6B4FC0;background:#EDE6FF}
.zbox{display:flex;gap:8px;margin-bottom:14px}
.zbox input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border:2px solid #CFC6EE;border-radius:14px;background:#fff;outline:none}
.zbox input:focus{border-color:#6B4FC0}
.zbox button{padding:0 18px;border-radius:14px;background:#5B3FB5;color:#fff;font-weight:700;text-align:center}
.znote{font-size:12.5px;color:var(--mute);margin:-6px 2px 12px}
.rhead{display:flex;align-items:center;gap:12px;margin:18px 0 10px;padding:12px 14px;border-radius:18px;color:#fff}
.nat .rhead{background:#2E9A63} .mor .rhead{background:#C9553A} .zod .rhead{background:#5B3FB5}
.rhead .re{font-size:44px;line-height:1;background:rgba(255,255,255,.22);border-radius:50%;width:66px;height:66px;display:grid;place-items:center;flex:none}
.rhead b{font-family:var(--display);font-weight:400;font-size:21px;display:block;line-height:1.3}
.rhead small{font-size:13px;opacity:.95;word-break:keep-all}
.tsearch{margin-bottom:12px}
.tsearch input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid #F0C9A0;border-radius:14px;background:#fff;outline:none}
.tsearch input:focus{border-color:#C9553A}
.tpick{text-align:center;color:var(--mute);font-size:14px;padding:14px 0 4px}

/* 우리말 분류하여 찾기 */
.wcat .tbanner{background:linear-gradient(135deg,#2E8B83,#1B625C 60%,#124A45)}
.wcat .tile{align-items:flex-start;text-align:left;padding:14px 12px 12px;border:0;color:#2B2A28;background:linear-gradient(160deg,var(--c1),var(--c2));min-height:128px;box-shadow:0 4px 0 rgba(0,0,0,.10)}
.wcat .tile .te{font-size:36px;line-height:1.15}
.wcat .tile b{font-family:var(--display);font-weight:400;font-size:19px;margin-top:4px}
.wcat .tile small{color:#3f4a47;font-size:12.5px;margin-top:1px;word-break:keep-all}
.wcat .tile .sw{display:block;margin-top:5px;font-size:12.5px;color:#14524D;font-weight:700;word-break:keep-all}
.wcat .tile em{font-style:normal;margin-top:auto;padding-top:6px;font-size:12px;font-weight:700;color:#14524D}
.wcat .tile.on{outline:3px solid #1B625C;outline-offset:1px}
.wcat .rhead{background:#23766F}
.foot{margin-top:28px;text-align:center;font-size:13.8px;color:var(--mute)}

const $app = document.getElementById('app');
const leafIndex = {}, hubOf = {};
Object.entries(MENU).forEach(([k,m])=>m.groups.forEach(g=>g.items.forEach(it=>{leafIndex[it.id]=it;hubOf[it.id]=k;it.status=it.status||'todo';})));
const allLeaves = Object.values(leafIndex);
const doneCount = a => a.filter(i=>i.status==='done').length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


function bar(backTo, top, bottom){
  return `<div class="bar"><button class="back" data-go="${backTo}" aria-label="뒤로">‹</button><div class="crumb">${esc(top)}<b>${esc(bottom)}</b></div></div>`;
}

function viewHub(k){
  const m = MENU[k];
  const groups = m.groups.map(g=>`<section class="group ${m.cls}">
    <h3>${esc(g.title)} ${g.note?`<span>${esc(g.note)}</span>`:''}</h3>
    ${g.items.map(it=>`<button class="item" data-go="${it.id}"><span class="ic">${it.ic}</span><span class="t">${esc(it.title)}<small>${esc(it.desc)}</small></span>${it.status==='done'?'<span class="tag ok">완성</span>':'<span class="tag">준비 중</span>'}</button>`).join('')}
  </section>`).join('');
  return `<div class="screen">${bar('home','안다미로',m.short)}
    <div class="hubhead ${m.cls}"><h2>${m.icon} ${esc(m.title)}</h2><p>${esc(m.sub)}</p></div>
    ${groups}</div>`;
}

function viewLeaf(id){
  const it = leafIndex[id], k = hubOf[id], m = MENU[k];
  if(it.status==='done' && typeof it.render==='function'){
    return `<div class="screen">${bar(k,m.title,it.title)}${it.render()}</div>`;
  }
  const g = m.groups.find(g=>g.items.includes(it));
  return `<div class="screen leaf">${bar(k,m.title+' › '+g.title,it.title)}
    <h2>${it.ic} ${esc(it.title)}</h2><p class="lead">${esc(it.desc)}</p>
    <div class="soon"><span class="em">🌱</span><div><b>이 메뉴는 준비 중이에요</b>곧 알찬 내용으로 채워질 예정이에요.</div></div>
    <div class="panel"><h3>구성 예정</h3><ul>${it.plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <button class="cta ${m.cls}" data-go="${k}">‹ ${esc(m.short)} 메뉴로 돌아가기</button></div>`;
}

function viewStatus(){
  const rows = Object.entries(MENU).map(([k,m])=>{
    const ls = m.groups.flatMap(g=>g.items), d = doneCount(ls);
    return `<h3>${m.icon} ${esc(m.title)} — ${d}/${ls.length}</h3>
    <div class="bar2"><i style="width:${ls.length?d/ls.length*100:0}%"></i></div>
    <table><tr><th>메뉴</th><th>상태</th></tr>${m.groups.map(g=>`<tr><td colspan="2" style="color:var(--mute);font-size:13.8px;padding-top:12px">${esc(g.title)}</td></tr>`+g.items.map(it=>`<tr><td><a href="#${it.id}" style="color:inherit">${esc(it.title)}</a></td><td>${it.status==='done'?'✅ 완성':'⬜ 준비 중'}</td></tr>`).join('')).join('')}</table>`;
  }).join('');
  return `<div class="screen doc">${bar('home','안다미로','제작 현황')}

}

    values:[['🗨️','말이 멋있어지고 설득력이 생겨요','긴 설명 대신 알맞은 속담 한마디면 듣는 사람이 금방 공감해요.'],['📜','옛사람의 생활을 엿볼 수 있어요','무엇을 먹고, 어떻게 농사를 지었고, 어떤 마음을 소중히 여겼는지 알 수 있는 살아 있는 역사예요.']],
    cards:[

/* ---------- 속담 찾기: 낱말로 찾기 ---------- */
const DB = {pv:null, wd:null};
function loadProverbs(){
  if(!DB.pv) DB.pv = fetch('data/proverbs.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(a=>{
    a.forEach(p=>{ p.n = p.t.replace(/\s+/g,''); p.mn = p.m.replace(/\s+/g,''); }); a.sort((a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko')); return a; })
    .catch(e=>{ DB.pv=null; throw e; });
  return DB.pv;
}
const CREDIT = '<div class="credit">속담·낱말 자료 출처: 국립국어원 <a href="https://opendict.korean.go.kr" target="_blank" rel="noopener">우리말샘</a><br>(CC BY-SA 2.0 KR) · 학생용으로 골라 다듬었어요</div>';
function renderFind(){
  return `<div id="sf">
    <div class="sf-box"><div class="sf-in"><input id="sfq" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="낱말을 입력해 보세요 (예: 호랑이, 바늘)" aria-label="속담 속 낱말"><button class="sf-clear" id="sfx" aria-label="지우기">✕</button></div>
    <div class="sf-opt"><button class="chip on" data-lv="all">모든 속담</button><button class="chip" data-lv="A">쉬운 속담만</button></div></div>
    <div id="sfr"><div class="sf-info">속담 데이터를 불러오는 중…</div></div>${CREDIT}</div>`;
}
function initFind(){
  const q=document.getElementById('sfq'), out=document.getElementById('sfr');
  let data=[], lv='all', shown=30, last=[];
  const hl=(text,toks)=>{
    const e=esc(text); if(!toks.length) return e;
    const re=new RegExp('('+toks.map(t=>[...t].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*')).join('|')+')','g');
    return text.split(re).map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join('');
  };
  const card=(p,toks)=>`<button class="pcard" data-id="${p.id}"><span class="pt">${hl(p.t,toks)}${p.lv==='B'?'<span class="lvb">조금 어려움</span>':''}</span>
    <div class="pm">${esc(p.m)}${p.s.length?`<div class="ps"><b>비슷한 속담</b> ${p.s.map(esc).join(' · ')}</div>`:''}</div></button>`;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function draw(){
    const raw=q.value.trim(), toks=raw.split(/\s+/).filter(Boolean).map(t=>t.replace(/\s+/g,''));
    const pool=lv==='A'?data.filter(p=>p.lv==='A'):data;
    if(!toks.length){
      const t=pick(data.filter(p=>p.lv==='A'&&p.t.length<=16));
      out.innerHTML=`<div class="today"><small>오늘의 속담</small><div class="pt">${esc(t.t)}</div><div class="pm">${esc(t.m)}</div></div>
        <div class="sf-info">검색창에 속담 속 낱말을 입력하면 찾아 줘요. 낱말의 일부만 써도 돼요. 찾은 속담을 누르면 뜻이 나와요.</div>`;
      return;
    }
    const all=pool.filter(p=>toks.every(t=>p.n.includes(t)));
    const body=pool.filter(p=>!all.includes(p)&&toks.every(t=>p.mn.includes(t)));
    const key=toks[0];
    all.sort((a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko'));
    body.sort((a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko'));
    last=all.concat(body);
    let h=`<div class="sf-info">‘${esc(raw)}’ 속담 ${all.length}개${body.length?` · 뜻풀이에서 ${body.length}개 더`:''}</div>`;
    if(!last.length) h+=`<div class="soon"><span class="em">🔍</span><div><b>찾는 속담이 없어요</b>낱말을 줄이거나 다른 낱말로 찾아보세요.</div></div>`;
    const vis=last.slice(0,shown);
    let i=0; const na=all.length;
    vis.forEach(p=>{ if(i===na && na>0) h+=`<div class="sf-h">뜻풀이에서 찾은 속담</div>`; h+=card(p,i<na?toks:[]); i++; });
    if(last.length>shown) h+=`<button class="more" id="sfmore">더 보기 (${last.length-shown}개 남음)</button>`;
    out.innerHTML=h;
  }
  loadProverbs().then(a=>{ data=a; draw(); }).catch(()=>{ out.innerHTML='<div class="soon"><span class="em">📡</span><div><b>속담 자료를 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 열어 주세요.</div></div>'; });
  q.addEventListener('input',()=>{ shown=30; draw(); });
  document.getElementById('sfx').addEventListener('click',()=>{ q.value=''; shown=30; draw(); q.focus(); });
  document.getElementById('sf').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(c){ lv=c.dataset.lv; document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); shown=30; draw(); return; }
    if(e.target.closest('#sfmore')){ shown+=30; draw(); return; }
    const pc=e.target.closest('.pcard'); if(pc) pc.classList.toggle('open');
  });
}

  const isJamo=t=>/^[ㄱ-ㅎ]+$/.test(t);

  const card=(x,t)=>`<button class="pcard" data-i="1"><span class="pt">${hl(x.w,t)}<small>${esc(x.p)}</small><span class="pq">${esc(x.m[0])}</span></span>
    <div class="pm">${x.m.length>1?`<ol>${x.m.map(m=>`<li>${esc(m)}</li>`).join('')}</ol>`:''}${x.e?`<div class="ex">예) ${esc(x.e)}</div>`:''}</div></button>`;

      const c=data.filter(x=>x.w.length>=2), x=c[Math.floor(Math.random()*c.length)];
      out.innerHTML=`<div class="today"><small>오늘의 우리말</small><div class="pt">${esc(x.w)} <span style="font-size:16.1px;opacity:.85">${esc(x.p)}</span></div><div class="pm">${esc(x.m[0])}</div></div>
        <div class="sf-info">글자를 입력하면 그 글자가 들어간 우리말을 찾아 줘요. 찾은 낱말을 누르면 뜻과 예문이 나와요.</div>`; return;
    }
    const j=isJamo(t);
    const lenOk=x=>{ const n=[...x.w].length; return !len||(len===5?n>=5:n===len); };
    const r=data.filter(x=>{
      if(!lenOk(x)) return false;
      if(!t) return true;
      if(j) return mode==='en'?x.ini.endsWith(t):mode==='in'?x.ini.includes(t):x.ini.startsWith(t);
      return mode==='st'?x.w.startsWith(t):mode==='en'?x.w.endsWith(t):x.w.includes(t);
    });
    const lt=len?(len===5?'5글자 이상':len+'글자'):'';
    let h=`<div class="sf-info">${t?'‘'+esc(t)+'’ ':''}${lt} 우리말 ${r.length}개</div>`;
    if(!r.length) h+=`<div class="soon"><span class="em">🔍</span><div><b>찾는 낱말이 없어요</b>글자를 줄이거나 다른 글자로 찾아보세요.</div></div>`;
    h+=r.slice(0,shown).map(x=>card(x,t)).join('');
    if(r.length>shown) h+=`<button class="more" id="wfmore">더 보기 (${r.length-shown}개 남음)</button>`;
    out.innerHTML=h;
  }
  const setJ=c=>document.querySelectorAll('#wfj button').forEach(b=>b.classList.toggle('on',b.dataset.j===c));
  loadWords().then(a=>{ data=a; draw(); }).catch(()=>{ out.innerHTML='<div class="soon"><span class="em">📡</span><div><b>우리말 자료를 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 열어 주세요.</div></div>'; });
  q.addEventListener('input',()=>{ shown=30; setJ(q.value.trim()); draw(); });
  document.getElementById('wf').addEventListener('click',e=>{
    const lc=e.target.closest('#wfl .chip'); if(lc){ len=+lc.dataset.l; document.querySelectorAll('#wfl .chip').forEach(x=>x.classList.toggle('on',x===lc)); shown=30; draw(); return; }
    const m=e.target.closest('#wfm .chip'); if(m){ mode=m.dataset.m; document.querySelectorAll('#wfm .chip').forEach(x=>x.classList.toggle('on',x===m)); shown=30; draw(); return; }
    const b=e.target.closest('#wfj button'); if(b){ q.value=b.dataset.j; mode='st'; document.querySelectorAll('#wfm .chip').forEach(x=>x.classList.toggle('on',x.dataset.m==='st')); setJ(b.dataset.j); shown=30; draw(); return; }
    if(e.target.closest('#wfx')){ q.value=''; setJ(''); len=0; document.querySelectorAll('#wfl .chip').forEach(x=>x.classList.toggle('on',x.dataset.l==='0')); shown=30; draw(); q.focus(); return; }
    if(e.target.closest('#wfmore')){ shown+=30; draw(); return; }
    const pc=e.target.closest('.pcard'); if(pc) pc.classList.toggle('open');
  });
}


/* ---------- 주제별 속담 찾기: 동식물 · 교훈 · 띠 ---------- */
DB.tg=null;
function loadTags(){
  if(!DB.tg) DB.tg=fetch('data/tags.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).catch(e=>{ DB.tg=null; throw e; });
  return DB.tg;
}
const LOADFAIL='<div class="soon"><span class="em">📡</span><div><b>속담 자료를 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 열어 주세요.</div></div>';
function tcard(p){
  return `<button class="pcard" data-id="${p.id}"><span class="pt">${esc(p.t)}${p.lv==='B'?'<span class="lvb">조금 어려움</span>':''}</span>
    <div class="pm">${esc(p.m)}${p.s.length?`<div class="ps"><b>비슷한 속담</b> ${p.s.map(esc).join(' · ')}</div>`:''}</div></button>`;
}
/* 결과 상자: 머리띠 + 속담 카드 목록 + 더 보기 */
function mountResult(box, head, ids, byid, cardFn){
  cardFn=cardFn||tcard;
  let shown=20;
  const draw=()=>{
    const list=ids.map(i=>byid[i]).filter(Boolean).sort((a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko'));
    box.innerHTML=`<div class="rhead"><span class="re">${head.e}</span><div><b>${esc(head.t)}</b><small>${esc(head.d)}</small></div></div>`
      +list.slice(0,shown).map(cardFn).join('')
      +(list.length>shown?`<button class="more" data-more="1">더 보기 (${list.length-shown}개 남음)</button>`:'');
  };
  box._draw=draw; box._more=()=>{ shown+=20; draw(); };
  draw();
}
function wireResult(root){
  root.addEventListener('click',e=>{
    if(e.target.closest('[data-more]')){ const b=e.target.closest('[id$=res]')||root.querySelector('.resbox'); if(b&&b._more) b._more(); return; }
    const pc=e.target.closest('.pcard'); if(pc) pc.classList.toggle('open');
  });
}
const byIdMap=a=>{ const m={}; a.forEach(p=>m[p.id]=p); return m; };
const PALT=[['#FFE9C6','#F7C98B'],['#D5EBE7','#9ED3CB'],['#F6DDD3','#EDAF9B'],['#E4E0F7','#BDB4EC'],['#FFF3B8','#F2D95F'],['#DDF0D6','#A9D79A']];

/* 동식물로 찾기 */
function renderNature(){
  return `<div class="nat" id="nat"><div class="tbanner"><span class="fl a">🐯</span><span class="fl b">🌸</span><span class="fl c">🌳</span><h2>🌿 속담 숲속 도감</h2><p>동물과 식물 친구를 눌러, 그 친구가 나오는 속담을 찾아보세요.</p></div>
    <div class="seg" id="natseg"><button class="on" data-k="an">🐾 동물</button><button data-k="pl">🌱 식물</button></div>
    <div class="tgrid c3" id="natgrid"></div>
    <div id="natres" class="resbox"><div class="tpick">👆 궁금한 친구를 눌러 보세요</div></div>${CREDIT}</div>`;
}
function initNature(){
  const root=document.getElementById('nat'), grid=document.getElementById('natgrid'), res=document.getElementById('natres');
  let T=null, by=null, kind='an';
  const draw=()=>{
    grid.innerHTML=T[kind].map((x,i)=>{ const c=PALT[i%6]; return `<button class="tile" data-i="${i}" style="--bg:${c[0]}"><span class="te">${x.e}</span><b>${esc(x.k)}</b><small>속담 ${x.ids.length}개</small></button>`; }).join('');
    res.innerHTML='<div class="tpick">👆 궁금한 친구를 눌러 보세요</div>';
  };
  Promise.all([loadTags(),loadProverbs()]).then(([t,a])=>{ T=t; by=byIdMap(a); draw(); }).catch(()=>{ res.innerHTML=LOADFAIL; });
  root.addEventListener('click',e=>{
    const sg=e.target.closest('#natseg button'); if(sg&&T){ kind=sg.dataset.k; document.querySelectorAll('#natseg button').forEach(b=>b.classList.toggle('on',b===sg)); draw(); return; }
    const t=e.target.closest('.tile'); if(t&&T){
      document.querySelectorAll('#natgrid .tile').forEach(x=>x.classList.toggle('on',x===t));
      const x=T[kind][+t.dataset.i];
      mountResult(res,{e:x.e,t:`${x.k} 속담 ${x.ids.length}개`,d:'속담을 누르면 뜻이 나와요'},x.ids,by);
      res.scrollIntoView({behavior:'smooth',block:'start'}); return;
    }
    if(e.target.closest('[data-more]')){ res._more&&res._more(); return; }
    const pc=e.target.closest('.pcard'); if(pc) pc.classList.toggle('open');
  });
}

/* 교훈으로 찾기 */
function renderMoral(){
  return `<div class="mor" id="mor"><div class="tbanner"><span class="fl a">🎁</span><span class="fl b">✨</span><span class="fl c">💎</span><h2>🧭 마음 보물상자</h2><p>마음에 새기고 싶은 교훈을 골라 보세요. 그 가르침이 담긴 속담이 나와요.</p></div>
    <div class="tsearch"><input id="morq" type="search" enterkeyhint="search" autocomplete="off" placeholder="🔍 낱말로 찾기 (예: 약속, 친구, 정성)"></div>

}
function initMoral(){
  const root=document.getElementById('mor'), grid=document.getElementById('morgrid'), res=document.getElementById('morres'), q=document.getElementById('morq');
  let T=null, by=null, all=[];
  Promise.all([loadTags(),loadProverbs()]).then(([t,a])=>{ T=t; all=a; by=byIdMap(a);
    grid.innerHTML=T.mo.map((x,i)=>{ const c=PALT[i%6]; return `<button class="tile" data-i="${i}" style="--c1:${c[0]};--c2:${c[1]}"><span class="te">${x.e}</span><b>${esc(x.k)}</b><small>${esc(x.d)}</small><em>속담 ${x.ids.length}개</em></button>`; }).join('');
  }).catch(()=>{ res.innerHTML=LOADFAIL; });
  q.addEventListener('input',()=>{
    const t=q.value.trim().replace(/\s+/g,'');
    document.querySelectorAll('#morgrid .tile').forEach(x=>x.classList.remove('on'));
    if(!t){ res.innerHTML='<div class="tpick">👆 마음에 드는 보물상자를 열어 보세요</div>'; return; }
    const r=all.filter(p=>p.n.includes(t)||p.mn.includes(t)).sort((a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko')).map(p=>p.id);

    mountResult(res,{e:'🔍',t:`‘${q.value.trim()}’ 속담 ${r.length}개`,d:'속담 또는 뜻풀이에서 찾았어요'},r,by);
  });
  root.addEventListener('click',e=>{
    const t=e.target.closest('.tile'); if(t&&T){
      q.value=''; document.querySelectorAll('#morgrid .tile').forEach(x=>x.classList.toggle('on',x===t));
      const x=T.mo[+t.dataset.i];
      mountResult(res,{e:x.e,t:`${x.k} 속담 ${x.ids.length}개`,d:x.d},x.ids,by);
      res.scrollIntoView({behavior:'smooth',block:'start'}); return;
    }
    if(e.target.closest('[data-more]')){ res._more&&res._more(); return; }
    const pc=e.target.closest('.pcard'); if(pc) pc.classList.toggle('open');
  });
}

/* 나의 띠로 속담 찾기 */
function renderZodiac(){

    <div class="znote">※ 띠는 음력 설을 기준으로 해서, 1~2월에 태어났다면 앞 해의 띠일 수 있어요.</div>
    <div class="tgrid c4" id="zgrid"></div>
    <div id="zres" class="resbox"><div class="tpick">👆 띠를 눌러 보세요</div></div>${CREDIT}</div>`;
}
function initZodiac(){
  const root=document.getElementById('zod'), grid=document.getElementById('zgrid'), res=document.getElementById('zres'), yi=document.getElementById('zy');
  let T=null, by=null;
  const pick=i=>{
    document.querySelectorAll('#zgrid .tile').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));
    const x=T.zo[i];
    mountResult(res,{e:x.e,t:`${x.k}띠 · 속담 ${x.ids.length}개`,d:x.d+(x.ids.length<10?' · 이 친구가 나오는 속담은 많지 않아요':'')},x.ids,by);
    res.scrollIntoView({behavior:'smooth',block:'start'});
  };
  Promise.all([loadTags(),loadProverbs()]).then(([t,a])=>{ T=t; by=byIdMap(a);
    grid.innerHTML=T.zo.map((x,i)=>`<button class="tile" data-i="${i}"><span class="te">${x.e}</span><b>${esc(x.k)}띠</b></button>`).join('');
  }).catch(()=>{ res.innerHTML=LOADFAIL; });
  const go=()=>{ const y=parseInt(yi.value,10); if(!T) return;
    if(!(y>=1900&&y<=2100)){ res.innerHTML='<div class="soon"><span class="em">🔢</span><div><b>태어난 해를 숫자 네 자리로 넣어 주세요</b>예) 2014</div></div>'; return; }
    pick(((y-4)%12+12)%12); };
  document.getElementById('zgo').addEventListener('click',go);
  yi.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  root.addEventListener('click',e=>{
    const t=e.target.closest('.tile'); if(t&&T){ pick(+t.dataset.i); return; }
    if(e.target.closest('[data-more]')){ res._more&&res._more(); return; }
    const pc=e.target.closest('.pcard'); if(pc) pc.classList.toggle('open');
  });
}


/* ---------- 우리말 찾기: 분류하여 찾기 ---------- */
let WTAG=null;
function loadWtags(){
  if(!WTAG) WTAG=fetch('data/wtags.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).catch(e=>{ WTAG=null; throw e; });

function wcardFn(x){

}

/* ---------- 라우팅 (#이름) ---------- */
function route(){
  const h = (location.hash||'').slice(1) || 'home';
  let html;
  if(h==='home') html=viewHome();
  else if(MENU[h]) html=viewHub(h);
  else if(leafIndex[h]) html=viewLeaf(h);
  else if(h==='help') html=viewHelp();
  else if(h==='status') html=viewStatus();
  else html=viewHome();
  $app.innerHTML = html;
  window.scrollTo(0,0);
  const lf=leafIndex[h]; if(lf && lf.status==='done' && lf.init) lf.init();
}
function go(id){ if(location.hash==='#'+id) route(); else location.hash = id; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
window.addEventListener('hashchange',route);
route();

/* ---------- 앱 설치 ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
document.addEventListener('click',e=>{
  if(e.target.closest('#installBtn') && deferredPrompt){
    e.stopImmediatePropagation();
    deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;});
  }
},true);
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
