<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안다미로 - 속담과 순우리말</title>
<meta name="theme-color" content="#1F6F68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192-3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안다미로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EA; --paper2:#F3EAD3; --ink:#2B2A28; --mute:#7A7468; --line:#E3D8BE;
  --pv:#B9482F; --pv-soft:#F6DDD3; --pv-deep:#8A3220;
  --wd:#23766F; --wd-soft:#D5EBE7; --wd-deep:#15524D;
  --display:'Jua','Noto Sans KR',sans-serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18.4px;line-height:1.6}
body{word-break:keep-all;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#app{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
.screen{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.bar{position:sticky;top:0;z-index:30;margin:-20px -18px 12px;padding:8px 18px;background:rgba(251,246,234,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;gap:3px;font-size:13px;line-height:1;white-space:nowrap;min-width:0;max-width:100%}
.nav .nv{height:28px;padding:0 10px;border-radius:99px;background:var(--paper2);color:var(--ink);font-weight:600;font-size:13px;flex:none}
.nav .sp{color:var(--mute);flex:none;font-size:12px}
.nav .cur{height:28px;display:inline-flex;align-items:center;padding:0 11px;border-radius:99px;background:var(--pv);color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav.wd .cur{background:var(--wd)}

/* 허브: 소주제 전체 보기 */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.gtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:22px;padding:16px 14px 14px;color:#2B2A28;background:linear-gradient(160deg,var(--c1),var(--c2));min-height:150px;box-shadow:0 5px 0 rgba(0,0,0,.10);transition:transform .1s,box-shadow .1s}
.gtile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.10)}
.ggrid.n4 .gtile{min-height:210px}
.gtile .te{font-size:42px;line-height:1.1}
.gtile b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.25;margin-top:8px;word-break:keep-all}
.gtile small{font-size:13.5px;color:#3f4a47;margin-top:3px;word-break:keep-all;line-height:1.4}
.gtile em{font-style:normal;margin-top:auto;padding-top:8px;font-size:13px;font-weight:700;color:#14524D}
.gtile em.wait{color:#7a6a4a}
.gtile .gar{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:20px}
.ghead{border-radius:0 0 26px 26px;padding:16px 18px 16px;margin:0 -18px 12px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#2B2A28}
.gh2{display:flex;align-items:center;gap:12px}
.hback.gb{background:rgba(255,255,255,.55);color:#2B2A28;margin-bottom:10px}
.ghead .te{font-size:40px;line-height:1}
.ghead h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.ghead p{font-size:14px;color:#3f4a47;margin-top:2px}
/* 속담의 유래: 탭 고정 */
.otw{position:sticky;top:44px;z-index:25;margin:-12px -18px 10px;padding:8px 18px 8px;background:rgba(251,246,234,.97);box-shadow:0 1px 0 var(--line)}
.otw.gtw{margin:0 -18px 10px}
.tabs.o3{grid-template-columns:repeat(3,1fr);gap:6px;padding:0;margin:0}
.tabs.o3.c2{grid-template-columns:1fr 1fr}
.tabs.o3 .chip{flex-direction:column;gap:2px;min-height:54px;padding:6px 4px;font-size:13px;font-weight:700;border-radius:12px}
.tabs.o3 .chip .ti{font-size:21px;line-height:1}
.cta.nx{position:sticky;bottom:8px;z-index:20;display:block;width:auto;margin:14px auto 0;padding:9px 22px;font-size:14.5px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.o-wrap .cta.nx{margin:0 auto;padding:8px 20px;position:static;box-shadow:none}
/* 속담의 유래: 한 화면에 딱 맞춤 */
#app:has(.o-wrap){padding-bottom:10px;min-height:0}
.screen:has(.o-wrap){display:flex;flex-direction:column;height:calc(100dvh - 36px)}
.o-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.o-wrap .otw{position:static;margin:0 -18px 6px;padding:2px 18px 8px;box-shadow:none;background:none}
.o-wrap .tabs.o3 .chip{min-height:clamp(44px,7dvh,56px);font-size:12.5px}
.o-wrap .tabs.o3 .chip .ti{font-size:clamp(17px,2.6dvh,22px)}
.o-wrap #obody{flex:1;min-height:0;display:flex;flex-direction:column}
.o-wrap .gdesc{flex:none;margin:0 2px 6px}
.o-wrap .gdesc b{font-size:19px}
.o-wrap .gdesc p{font-size:14px;line-height:1.35;margin-top:1px}
.o-wrap .slider{flex:1;min-height:0;padding:0;align-items:stretch}
.o-wrap .story{display:flex;flex-direction:column;overflow-y:auto;margin:0}
.o-wrap .story .scene{flex:none;height:clamp(54px,11dvh,96px)}
.o-wrap .story .scene .se{font-size:clamp(30px,5.4dvh,46px)}
.o-wrap .story .sb{padding:10px 14px 12px;flex:1}
.o-wrap .story h4{font-size:clamp(17px,2.5dvh,21px);margin-top:1px}
.o-wrap .story .ob{font-size:clamp(14.5px,2.1dvh,16.7px);line-height:1.55;margin-top:4px}
.o-wrap .story .sm{font-size:clamp(14px,1.95dvh,16px);margin-top:7px;padding:7px 11px}
.o-wrap .pg{flex:none;margin:6px 0 6px}
.o-wrap .pgb{height:40px;width:50px}
@media(max-height:720px){
.o-wrap .gdesc p{display:none}
.o-wrap .tabs.o3 .chip{min-height:42px;padding:3px 4px;gap:1px}
.o-wrap .tabs.o3 .chip .ti{font-size:15px}
.o-wrap .story .scene{height:40px}
.o-wrap .story .scene .se{font-size:24px}
.o-wrap .story .sn{display:none}
.o-wrap .story .sb{padding:8px 12px 10px}
.o-wrap .story .hint{display:none}
.o-wrap .pgb{height:34px}
.o-wrap .pg{margin:4px 0}
.o-wrap .dots{margin-top:2px}
}
/* 상단 배너 공통: 은은한 패턴 + 도형 분할 */
:root{--pat-sg:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2218%22%3E%3Cg fill=%22none%22 stroke=%22%23FFE2A0%22 stroke-opacity=%22.15%22 stroke-width=%221%22%3E%3Ccircle cx=%220%22 cy=%220%22 r=%2216%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%2211%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%226%22/%3E%3Ccircle cx=%2236%22 cy=%220%22 r=%2216%22/%3E%3Ccircle cx=%2236%22 cy=%220%22 r=%2211%22/%3E%3Ccircle cx=%2236%22 cy=%220%22 r=%226%22/%3E%3Ccircle cx=%2218%22 cy=%229%22 r=%2216%22/%3E%3Ccircle cx=%2218%22 cy=%229%22 r=%2211%22/%3E%3Ccircle cx=%2218%22 cy=%229%22 r=%226%22/%3E%3C/g%3E%3C/svg%3E");--pat-dot:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2222%22 height=%2222%22%3E%3Ccircle cx=%2211%22 cy=%2211%22 r=%222%22 fill=%22%23E4FFF6%22 fill-opacity=%22.16%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3Ccircle cx=%2222%22 cy=%220%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3Ccircle cx=%220%22 cy=%2222%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3Ccircle cx=%2222%22 cy=%2222%22 r=%221.3%22 fill=%22%23E4FFF6%22 fill-opacity=%22.12%22/%3E%3C/svg%3E");--pat-dia:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2218%22 height=%2218%22%3E%3Cpath d=%22M9 1.5 L16.5 9 L9 16.5 L1.5 9Z%22 fill=%22none%22 stroke=%22%232B2A28%22 stroke-opacity=%22.08%22 stroke-width=%221%22/%3E%3C/svg%3E");--pat-diaw:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2218%22 height=%2218%22%3E%3Cpath d=%22M9 1.5 L16.5 9 L9 16.5 L1.5 9Z%22 fill=%22none%22 stroke=%22%23fff%22 stroke-opacity=%22.2%22 stroke-width=%221%22/%3E%3C/svg%3E")}
.hubhead,.lbanner,.ghead,.fhead{position:relative;overflow:hidden;isolation:isolate}
.hubhead::after,.lbanner::after,.ghead::after,.fhead::after{content:"";position:absolute;right:-34px;top:-46px;width:132px;height:132px;border-radius:50%;border:1.5px dashed rgba(255,236,180,.5);box-shadow:0 0 0 14px rgba(255,236,180,.08),inset 0 0 0 12px rgba(255,236,180,.06);z-index:-1;pointer-events:none}
.hubhead.pv,.lbanner.pv,.fhead.pv{background:linear-gradient(112deg,transparent 0 70%,rgba(70,15,8,.18) 70% 100%),radial-gradient(circle at 90% 10%,rgba(255,226,160,.40),transparent 48%),var(--pat-sg),linear-gradient(135deg,#DB5B3E,#B13A25 55%,#862618)}
.hubhead.wd,.lbanner.wd,.fhead.wd{background:linear-gradient(112deg,transparent 0 70%,rgba(4,50,45,.20) 70% 100%),radial-gradient(circle at 90% 10%,rgba(228,255,246,.38),transparent 48%),var(--pat-dot),linear-gradient(135deg,#3AA79B,#1F7B71 55%,#145C54)}
.hubhead::before,.lbanner::before,.fhead::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,rgba(240,191,90,.9),transparent);z-index:-1}
.ghead{background:linear-gradient(112deg,transparent 0 72%,rgba(255,255,255,.22) 72% 100%),radial-gradient(circle at 92% 8%,rgba(255,255,255,.6),transparent 46%),var(--pat-dia),linear-gradient(160deg,var(--c1),var(--c2))}
.gtile{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.5),transparent 55%),var(--pat-dia),linear-gradient(160deg,var(--c1),var(--c2))}
.i3{background:radial-gradient(circle at 100% 0,rgba(255,255,255,.35),transparent 50%),var(--pat-diaw),linear-gradient(150deg,var(--c1),var(--c2))}
.lbanner{margin:-12px -18px 14px;padding:16px 20px 20px;border-radius:0 0 26px 26px;color:#fff}
.lbanner h2{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.25;margin:0 0 4px;color:#FFF6DC;text-shadow:0 2px 0 rgba(60,12,6,.35);word-break:keep-all}
.lbanner .lead{color:rgba(255,255,255,.95);margin:0;font-size:15.5px;line-height:1.5}
/* ===== 검색 화면: 한 화면 맞춤 + 가로 넘기기 ===== */
#app:has(.fitwrap){padding-bottom:10px;min-height:0}
.screen:has(.fitwrap){display:flex;flex-direction:column;height:calc(100dvh - 36px)}
.fitwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.fitwrap.wd{--pv:var(--wd);--pv-soft:var(--wd-soft);--pv-deep:var(--wd-deep)}
.fhead{display:flex;align-items:center;gap:10px;margin:-12px -18px 8px;padding:9px 18px 11px;color:#fff;border-radius:0 0 20px 20px;flex:none}
.fhead .fhe{font-size:30px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.fhead b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;color:#FFF6DC;display:block}
.fhead small{display:block;font-size:13px;line-height:1.3;opacity:.95;margin-top:1px;word-break:keep-all}
.fctl{flex:none;margin-bottom:6px}
.fin{display:flex;gap:8px;position:relative}
.fin input{flex:1;min-width:0;font:inherit;font-size:17.5px;padding:10px 40px 10px 13px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
.fin input:focus{border-color:var(--pv)}
.fin input::placeholder{font-size:16px;color:#9b9486}
.fin .fclr{position:absolute;right:6px;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:50%;color:#8a8372;font-size:15px}
.fin .fgo{flex:none;padding:0 16px;border-radius:14px;background:var(--pv);color:#fff;font-weight:700;font-size:15.5px}
.fchips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.fchips .chip{padding:5px 12px;font-size:14px}
.fchips .chip.on{background:var(--pv);color:#fff}
.fitwrap .jamo{grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 0}
.fitwrap .jamo button{padding:3px 0;font-size:17px;border-radius:9px}
.fseg{display:flex;gap:6px;background:var(--paper2);border-radius:99px;padding:4px}
.fseg button{flex:1;text-align:center;padding:8px 0;border-radius:99px;font-weight:700;font-size:16px}
.fseg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);color:var(--pv-deep)}
.fstage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.fmsg{margin:auto;text-align:center;color:var(--mute);font-size:16px;line-height:1.6;padding:0 20px;word-break:keep-all}
.fmsg b{display:block;color:var(--ink);font-size:17px}
.fmsg .em{display:block;font-size:34px}
.fpg{flex:none;display:flex;align-items:center;gap:10px;margin:6px 0 4px;min-height:0}
.fpg:empty{display:none}
.fpg .pgm{flex:1;min-width:0}
.fpg .pgm b{display:block;text-align:center;font-size:15px}
.fpg input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--pv);height:22px}
.fpg .pgb{height:40px;width:50px}
.cp{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cp::-webkit-scrollbar{display:none}
.cpage{flex:0 0 100%;scroll-snap-align:start;display:grid;gap:8px;align-content:stretch;padding:2px 1px}
.ftile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:18px;padding:6px 4px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#2B2A28;box-shadow:0 4px 0 rgba(0,0,0,.1);min-width:0;transition:transform .08s}
.vtile{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:14px;background:#fff;border:1px solid var(--line);overflow:hidden;color:var(--ink);text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.fitwrap.vid .fstage{background:#2B1F1B;background:color-mix(in srgb,var(--pv-deep) 38%,#0d0907);border-radius:18px;padding:8px}
.fitwrap.vid .cpage{gap:7px;padding:0}
.fitwrap.vid .vtile{background:var(--vc);border:0;box-shadow:none;border-radius:12px;color:#fff}
.fitwrap.vid .vtile .vth{border-radius:12px 12px 0 0}
.fitwrap.vid .vtile b{color:#fff;font-weight:800}
.fitwrap.vid .vtile small{color:rgba(255,255,255,.85)}
.fitwrap.vid .eh{background:rgba(255,255,255,.22)}
.vtile:active{transform:translateY(2px)}
.vtile .vth{flex:1;min-height:0;position:relative;background:linear-gradient(150deg,#E5663F,#8E2A1B) center/cover no-repeat;display:block}
.vtile .vpl{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(200,30,30,.92);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;padding-left:2px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.vtile b{flex:none;font-size:12.3px;line-height:1.25;padding:4px 7px 0;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vtile small{flex:none;font-size:10.5px;color:var(--mute);padding:1px 7px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.ftile .te{font-size:clamp(26px,4.4dvh,38px);line-height:1.1}
.ftile b{font-size:14.5px;margin-top:2px;line-height:1.25;word-break:keep-all}
.ftile small{font-size:11.8px;color:#4b4a44;margin-top:1px}
.rhd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;font-size:14px;color:#4a463e;min-height:30px}
.rhd b{font-size:15.5px;color:var(--ink)}
.rhd button{height:30px;padding:0 12px;border-radius:99px;background:var(--paper2);font-size:13.5px;font-weight:700;flex:none}
.rpv{flex:1;min-height:0;position:relative;touch-action:pan-y}
.rcard{height:100%}
.rcard.slR{animation:slR .22s ease}.rcard.slL{animation:slL .22s ease}
@keyframes slR{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
.bc{height:100%;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 6px 14px rgba(60,40,20,.10)}
.bc.wd{--pv:var(--wd);--pv-soft:var(--wd-soft);--pv-deep:var(--wd-deep)}
.bc .bt{flex:none;min-height:34%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:16px;color:#FFF6DC;font-family:var(--display);font-size:clamp(23px,3.7dvh,33px);line-height:1.4;word-break:keep-all;text-shadow:0 2px 0 rgba(60,12,6,.3)}
.bc.pv .bt{background:var(--pat-sg),linear-gradient(135deg,#DB5B3E,#B13A25 55%,#862618)}
.bc.wd .bt{background:var(--pat-dot),linear-gradient(135deg,#3AA79B,#1F7B71 55%,#145C54)}
.bc .bt small{font-family:var(--sans);font-size:14px;opacity:.92;text-shadow:none}
.bc .bt mark{background:#FFE08A;color:#5a2d0c;border-radius:4px;padding:0 2px;text-shadow:none}
.bc .bb{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 16px}
.bb .bm{font-size:clamp(16px,2.5dvh,19px);line-height:1.6;word-break:keep-all}
.bb .bm b,.bb .bs b,.bb .bx b{display:inline-block;font-size:12.5px;background:var(--pv);color:#fff;border-radius:99px;padding:1px 9px;margin-right:6px}
.bb .bs{margin-top:10px;font-size:15.5px;color:var(--pv-deep);line-height:1.6;word-break:keep-all}
.bb .bx{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--pv-soft);font-size:16px;line-height:1.55;word-break:keep-all}
.bb ol{padding-left:20px;font-size:17px;line-height:1.6;word-break:keep-all}
.bb .lvb{float:right;font-size:12.6px;color:var(--mute);background:var(--paper2);border-radius:99px;padding:1px 8px}
.fother{flex:none;display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.fother small{font-size:12px;color:var(--mute);flex:none}
.fother button{flex:1;min-width:0;height:36px;border-radius:99px;background:var(--paper2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.fother button i{font-style:normal;font-size:15px}
/* 검색 첫 화면: 큰 카드 */
.screen.fgs{margin-bottom:-40px}
.fgrid{display:grid;gap:6px;margin:0 -18px;height:calc(100dvh - 62px);min-height:360px}
.fgrid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

const allLeaves = Object.values(leafIndex);

const groupIndex={}; Object.entries(MENU).forEach(([k,m])=>m.groups.forEach(g=>{ groupIndex[g.id]={k,g}; g.items.forEach(it=>{it.gid=g.id;}); }));
const doneCount = a => a.filter(i=>i.status==='done').length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


function nav(trail, cls, ob){
  const last=trail.length-1;
  return `<nav class="nav ${cls||''}${ob?' ob'+(ob==='g'?' gb':''):''}" aria-label="현재 위치">`+trail.map((t,i)=>i===last?`<span class="cur" aria-current="page">${esc(t[0])}</span>`:`<button class="nv" data-go="${t[1]}">${i===0?'🏠 ':''}${esc(t[0])}</button><span class="sp">›</span>`).join('')+`</nav>`;
}
function bar(trail, cls){ return `<div class="bar">${nav(trail,cls)}</div>`; }

function viewHub(k){
  const m = MENU[k], n=m.groups.length;
  const tiles = m.groups.map((g,i)=>{
    const c=PALT[i%6], done=g.items.filter(x=>x.status==='done').length, tot=g.items.length;
    const badge = done===tot?`<em>완성 ${tot}/${tot}</em>`:done?`<em>${done}/${tot} 완성</em>`:`<em class="wait">준비 중 · ${tot}개</em>`;
    return `<button class="gtile" data-go="${g.id}" style="--c1:${c[0]};--c2:${c[1]}"><span class="te">${GIC[g.id]||'📚'}</span><b>${esc(g.title)}</b><small>${esc(g.note||g.items.map(x=>x.title).slice(0,2).join(' · '))}</small>${badge}<span class="gar">›</span></button>`;
  }).join('');
  return `<div class="screen hubs">
    ${bar([['처음','home'],[m.short]],m.cls)}
    <div class="hubhead ${m.cls}"><h2>${m.icon} ${esc(m.title)}</h2><p>${esc(m.sub)}</p></div>
    <div class="ggrid n${n}">${tiles}</div></div>`;
}

      <span class="i3art" aria-hidden="true"><i class="blob"></i>${x.art.map(a=>`<em class="ae ${a[2]}" style="--r:${a[1]}deg">${a[0]}</em>`).join('')}</span>

function viewFindHome(g,m,k){
  const n=g.items.length, pal=FCOL[m.cls];
  const cards=g.items.map((it,i)=>{ const c=pal[i%pal.length], pat=['--pat-sg','--pat-diaw','--pat-sg','--pat-diaw'][i%4];
    const patv=m.cls==='wd'?(i%2?'--pat-diaw':'--pat-dot'):pat;
    return `<button class="fcard ${m.cls}" data-go="${it.id}" style="--c1:${c[0]};--c2:${c[1]};--pat:var(${patv})"><span class="fico">${it.ic}</span><b>${esc(it.title)}</b><small>${esc(it.desc)}</small><span class="go">›</span></button>`; }).join('');

function viewGroup(id){
  { const gi=groupIndex[id]; if(id!=='p-intro' && gi.g.items.every(x=>x.status==='done')) return viewFindHome(gi.g,MENU[gi.k],gi.k); }

  const {k,g}=groupIndex[id], m=MENU[k], i=m.groups.indexOf(g), c=PALT[i%6];
  return `<div class="screen hubs">

function viewLeaf(id){
  const it = leafIndex[id], k = hubOf[id], m = MENU[k];
  if(it.status==='done' && typeof it.render==='function'){
    curCls=m.cls;
    return `<div class="screen">${bar([['처음','home'],[m.short,k],...(it.gid==='p-media'||it.gid==='w-media'?[]:[[groupIndex[it.gid].g.title,it.gid]]),[it.title]],m.cls)}${it.render()}</div>`;
  }
  const g = m.groups.find(g=>g.items.includes(it));
  return `<div class="screen leaf">${bar([['처음','home'],[m.short,k],[g.title,g.id],[it.title]],m.cls)}
    <h2>${it.ic} ${esc(it.title)}</h2><p class="lead">${esc(it.desc)}</p>

}

function viewStatus(){
  const rows = Object.entries(MENU).map(([k,m])=>{
    const ls = m.groups.flatMap(g=>g.items), d = doneCount(ls);
    return `<h3>${m.icon} ${esc(m.title)} — ${d}/${ls.length}</h3>

function setupPager(px){
  const sl=document.getElementById(px+'sl'); if(!sl) return;
  const n=sl.children.length, cnt=document.getElementById(px+'cnt'), dots=[...document.querySelectorAll('#'+px+'dots i')];
  const idx=()=>Math.max(0,Math.min(n-1,Math.round(sl.scrollLeft/(sl.clientWidth+12))));
  const eh=edgeHints(sl,idx,n);
  const upd=()=>{ const i=idx(); cnt.textContent=(i+1)+' / '+n; dots.forEach((d,k)=>d.classList.toggle('on',k===i)); eh(); };
  sl.addEventListener('scroll',upd,{passive:true}); upd(); setTimeout(upd,300);
}
const pagerBar=(px,n)=>`<div class="pg"><div class="pgm"><b id="${px}cnt">1 / ${n}</b><div class="dots" id="${px}dots">${Array.from({length:n},(_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div></div></div>`;
/* 좌우 넘김 표시: 오른쪽에 더 있으면 》, 왼쪽에 더 있으면 《 (반투명, 깜빡임) */
function edgeHints(sl,idx,n){
  const par=sl.parentElement; if(!par) return ()=>{};
  if(getComputedStyle(par).position==='static') par.style.position='relative';
  par.querySelectorAll(':scope>.eh').forEach(e=>e.remove());
  const L=document.createElement('span'),R=document.createElement('span');
  L.className='eh l';L.textContent='《';R.className='eh r';R.textContent='》';
  par.append(L,R);
  return ()=>{ const i=idx(), t=(sl.offsetTop+(sl.classList.contains('slider')?Math.min(48,sl.offsetHeight/2):sl.offsetHeight/2))+'px'; L.style.top=R.style.top=t; L.hidden=i<=0; R.hidden=i>=n-1; };
}
function initMeaning(){ setupPager('m'); }

    body.innerHTML=`<div class="gdesc"><b>${g.ic} ${esc(g.t)} <small>${g.items.length}가지</small></b><p>${esc(g.d)}</p></div>

const DB = {pv:null, wd:null};
function loadProverbs(){
  if(!DB.pv) DB.pv = fetch('data/proverbs.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(a=>{
    a.forEach(p=>{ p.n = p.t.replace(/\s+/g,''); p.mn = p.m.replace(/\s+/g,''); }); a.sort((a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko')); return a; })
    .catch(e=>{ DB.pv=null; throw e; });
  return DB.pv;
}

/* ===== 검색 화면 공통: 한 화면 맞춤 · 가로 넘기기 · 다른 검색 메뉴 ===== */
const FIT_OTHERS={
  'p-find':[['p-f-word','🔤','낱말'],['p-f-nature','🌿','동식물'],['p-f-moral','🧭','교훈'],['p-f-zodiac','🐯','띠']],
  'w-find':[['w-f-char','🔡','글자'],['w-f-cat','🗂️','분류']]
};
const fq=s=>document.querySelector(s);
const LOADFAIL='<div class="soon"><span class="em">📡</span><div><b>자료를 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 열어 주세요.</div></div>';
function fitShell(id,ic,title,desc,ctl){
  const gid=leafIndex[id].gid, others=(FIT_OTHERS[gid]||[]).filter(o=>o[0]!==id), solo=!FIT_OTHERS[gid];
  return `<div class="leaf fitwrap ${curCls}" id="fx">
    <div class="fhead ${curCls}"><span class="fhe">${ic}</span><div><b>${title}</b><small>${desc}</small></div></div>
    ${ctl?`<div class="fctl">${ctl}</div>`:''}
    <div class="fstage" id="fst"><div class="fmsg">불러오는 중…</div></div>
    <div class="fpg" id="fpg"></div>
    ${solo?`<div class="fother"><button data-go="${hubOf[id]}"><i>🏠</i>${MENU[hubOf[id]].short} 메뉴로</button></div>`:`<div class="fother"><small>다른 검색</small>${others.map(o=>`<button data-go="${o[0]}"><i>${o[1]}</i>${o[2]}</button>`).join('')}<button data-go="${gid}"><i>🏠</i>메뉴</button></div>`}</div>`;
}
function fitMsg(h){ fq('#fst').innerHTML=`<div class="fmsg">${h}</div>`; fq('#fpg').innerHTML=''; }
function fitOne(label,html){ fq('#fst').innerHTML=`<div class="rhd"><span>${label}</span></div><div class="rpv"><div class="rcard">${html}</div></div>`; fq('#fpg').innerHTML=''; }
/* 선택지: 한 화면에 맞는 만큼 타일을 놓고 가로로 넘김 */
function fitChoices(items,tileFn,cols,pick,fixRows){
  const st=fq('#fst'), pg=fq('#fpg'); st.innerHTML='<div class="cp" id="cp"></div>';
  const H=st.clientHeight||320, minH=cols>=4?84:92;
  let rows=fixRows||Math.max(2,Math.floor((H+8)/(minH+8))), per=cols*rows;
  if(!fixRows&&items.length<=per){ rows=Math.ceil(items.length/cols); per=cols*rows; }
  const rowH=Math.floor((H-(rows-1)*8)/rows), np=Math.ceil(items.length/per);
  let h='';
  for(let p=0;p<np;p++) h+=`<div class="cpage" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${items.slice(p*per,(p+1)*per).map((x,k)=>tileFn(x,p*per+k)).join('')}</div>`;
  const cp=fq('#cp'); cp.innerHTML=h;
  if(np>1){
    pg.innerHTML=`<div class="pgm"><b id="ccnt">1 / ${np} 쪽</b><div class="dots">${Array.from({length:np},(_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div></div>`;
    const dots=[...pg.querySelectorAll('.dots i')], cn=fq('#ccnt');
    const idx=()=>Math.max(0,Math.min(np-1,Math.round(cp.scrollLeft/cp.clientWidth)));
    const eh=edgeHints(cp,idx,np);
    const upd=()=>{ const i=idx(); cn.textContent=(i+1)+' / '+np+' 쪽'; dots.forEach((d,k)=>d.classList.toggle('on',k===i)); eh(); };
    cp.addEventListener('scroll',upd,{passive:true}); upd(); setTimeout(upd,300);
  } else pg.innerHTML='';
  cp.onclick=e=>{ const t=e.target.closest('[data-i]'); if(t) pick(+t.dataset.i); };
}
/* 결과: 목록으로 보여 주고, 하나를 누르면 설명이 말풍선으로 떴다가 다른 것을 누르면 사라짐 */
function fitResults(R,list,o){
  const st=fq('#fst'), pg=fq('#fpg'), n=list.length; pg.innerHTML='';
  const head=`<div class="rhd"><span>${o.e||''} <b>${esc(o.title||'')}</b></span>${o.onBack?`<button id="rback">↩ ${o.back||'다시 고르기'}</button>`:''}</div>`;
  if(!n){ st.innerHTML=head+`<div class="fmsg"><span class="em">🔍</span><b>찾는 것이 없어요</b>다른 말로 찾아보세요.</div>`; if(o.onBack) fq('#rback').onclick=o.onBack; return; }
  st.innerHTML=head+'<div class="rl" id="rl"></div>';
  const box=fq('#rl'); let shown=0, open=-1;
  const more=()=>{ const end=Math.min(n,shown+60); let h=''; for(let k=shown;k<end;k++) h+=`<button class="ri" data-i="${k}" aria-expanded="false"><span class="rn">${k+1}</span><span class="rt">${R.t(list[k],k)}</span></button>`; box.insertAdjacentHTML('beforeend',h); shown=end; };
  more();
  const close=()=>{ const b=box.querySelector('.rbub'); if(b) b.remove(); box.querySelectorAll('.ri.on').forEach(x=>{ x.classList.remove('on'); x.setAttribute('aria-expanded','false'); }); open=-1; };
  box.addEventListener('click',e=>{
    const it=e.target.closest('.ri'); if(!it){ if(e.target.closest('.rbub')) close(); return; }
    const k=+it.dataset.i, same=open===k; close(); if(same) return;
    it.classList.add('on'); it.setAttribute('aria-expanded','true'); open=k;
    it.insertAdjacentHTML('afterend',`<div class="rbub" role="note">${R.b(list[k],k)}<span class="rx">닫기</span></div>`);
    const b=it.nextElementSibling; box.scrollTo({top:Math.max(0,it.offsetTop-box.offsetTop-6),behavior:'smooth'});
  });
  box.addEventListener('scroll',()=>{ if(shown<n && box.scrollTop+box.clientHeight>box.scrollHeight-160) more(); },{passive:true});
  if(o.onBack) fq('#rback').onclick=o.onBack;
}
const hlP=(text,toks)=>{
  const e=esc(text); if(!toks||!toks.length) return e;
  const re=new RegExp('('+toks.map(t=>[...t].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*')).join('|')+')','g');
  return text.split(re).map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join('');
};
function bcP(p,toks){
  return `<div class="bc pv"><div class="bt">${hlP(p.t,toks)}</div><div class="bb">${p.lv==='B'?'<span class="lvb">조금 어려움</span>':''}<div class="bm"><b>뜻</b>${esc(p.m)}</div>${p.s&&p.s.length?`<div class="bs"><b>비슷한 속담</b>${p.s.map(esc).join(' · ')}</div>`:''}</div></div>`;
}
function bcW(x,toks){
  return `<div class="bc wd"><div class="bt">${toks&&toks.length&&!/^[ㄱ-ㅎ]+$/.test(toks[0])?hlP(x.w,toks):esc(x.w)}<small>${esc(x.p)}</small></div><div class="bb">${x.m.length>1?`<ol>${x.m.map(m=>`<li>${esc(m)}</li>`).join('')}</ol>`:`<div class="bm"><b>뜻</b>${esc(x.m[0])}</div>`}${x.e?`<div class="bx"><b>예문</b>${esc(x.e)}</div>`:''}</div></div>`;
}
const rP=tk=>({ t:(p,i)=>hlP(p.t,typeof tk==='function'?tk(i):tk)+(p.lv==='B'?'<span class="lvb">조금 어려움</span>':''),
  b:p=>`<div class="bm"><b>뜻</b>${esc(p.m)}</div>${p.s&&p.s.length?`<div class="bs"><b>비슷한 속담</b>${p.s.map(esc).join(' · ')}</div>`:''}` });
const rW=tk=>({ t:x=>(tk&&tk.length&&!/^[ㄱ-ㅎ]+$/.test(tk[0])?hlP(x.w,tk):esc(x.w))+`<small>${esc(x.p)}</small>`,
  b:x=>(x.m.length>1?`<ol>${x.m.map(m=>`<li>${esc(m)}</li>`).join('')}</ol>`:`<div class="bm"><b>뜻</b>${esc(x.m[0])}</div>`)+(x.e?`<div class="bx"><b>예문</b>${esc(x.e)}</div>`:'') });
const ftile=(e,k,s,c)=>`<button class="ftile" data-i="@I@" style="--c1:${c[0]};--c2:${c[1]}"><span class="te">${e}</span><b>${esc(k)}</b><small>${esc(s)}</small></button>`;
const tileHtml=(x,i,c,e,k,s)=>ftile(e,k,s,c).replace('@I@',i);
const byKo=(a,b)=>(a.t||a.w).localeCompare(b.t||b.w,'ko');

/* 낱말로 찾기 */
function renderFind(){
  return fitShell('p-f-word','🔤','낱말로 찾기','속담 속 낱말만 넣어도 찾아져요',
   `<div class="fin"><input id="sfq" type="search" enterkeyhint="search" autocomplete="off" placeholder="낱말을 넣어 보세요 (예: 호랑이)" aria-label="속담 속 낱말"><button class="fclr" id="sfx" aria-label="지우기">✕</button></div>
    <div class="fchips" id="sfl"><button class="chip on" data-lv="all">모든 속담</button><button class="chip" data-lv="A">쉬운 속담만</button></div>`);
}
function initFind(){
  const q=fq('#sfq'); let data=[], lv='all';
  const draw=()=>{
    const raw=q.value.trim(), toks=raw.split(/\s+/).filter(Boolean).map(t=>t.replace(/\s+/g,''));
    const pool=lv==='A'?data.filter(p=>p.lv==='A'):data;
    if(!toks.length){ const c=data.filter(p=>p.lv==='A'&&p.t.length<=16), t=c[Math.floor(Math.random()*c.length)]; fitOne('⭐ <b>오늘의 속담</b> · 위 칸에 낱말을 넣으면 찾아 줘요',bcP(t)); return; }
    const all=pool.filter(p=>toks.every(t=>p.n.includes(t))), body=pool.filter(p=>!all.includes(p)&&toks.every(t=>p.mn.includes(t)));
    all.sort(byKo); body.sort(byKo);
    fitResults(rP(i=>i<all.length?toks:[]),all.concat(body),{e:'🔍',title:`‘${raw}’ 속담 ${all.length}개${body.length?` · 뜻풀이 ${body.length}개`:''}`});
  };
  loadProverbs().then(a=>{ data=a; draw(); }).catch(()=>fitMsg(LOADFAIL));
  q.addEventListener('input',()=>data.length&&draw());
  fq('#sfx').onclick=()=>{ q.value=''; data.length&&draw(); q.focus(); };
  fq('#sfl').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; lv=c.dataset.lv; fq('#sfl').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); data.length&&draw(); };
}

/* 동식물로 찾기 */
function renderNature(){
  return fitShell('p-f-nature','🌿','동식물로 찾기','친구를 눌러 그 친구가 나오는 속담을 찾아요',
   `<div class="fseg" id="natseg"><button class="on" data-k="an">🐾 동물</button><button data-k="pl">🌱 식물</button></div>`);
}
function initNature(){
  let T=null, by=null, kind='an';
  const choose=()=>fitChoices(T[kind],(x,i)=>tileHtml(x,i,PALT[i%6],x.e,x.k,`속담 ${x.ids.length}개`),3,i=>{
    const x=T[kind][i], list=x.ids.map(id=>by[id]).filter(Boolean).sort(byKo);
    fitResults(rP([]),list,{e:x.e,title:`${x.k} 속담 ${list.length}개`,onBack:choose});
  });
  Promise.all([loadTags(),loadProverbs()]).then(([t,a])=>{ T=t; by=byIdMap(a); choose(); }).catch(()=>fitMsg(LOADFAIL));
  fq('#natseg').onclick=e=>{ const b=e.target.closest('button'); if(!b||!T) return; kind=b.dataset.k; fq('#natseg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); choose(); };
}

/* 교훈으로 찾기 */
function renderMoral(){
  return fitShell('p-f-moral','🧭','교훈으로 찾기','마음에 새기고 싶은 교훈을 골라 보세요',
   `<div class="fin"><input id="morq" type="search" enterkeyhint="search" autocomplete="off" placeholder="🔍 낱말로 찾기 (예: 약속, 친구, 정성)" aria-label="낱말"></div>`);
}
function initMoral(){
  let T=null, by=null, all=[];
  const q=fq('#morq');
  const choose=()=>fitChoices(T.mo,(x,i)=>tileHtml(x,i,PALT[i%6],x.e,x.k,`속담 ${x.ids.length}개`),3,i=>{
    const x=T.mo[i], list=x.ids.map(id=>by[id]).filter(Boolean).sort(byKo);
    q.value=''; fitResults(rP([]),list,{e:x.e,title:`${x.k} 속담 ${list.length}개`,onBack:choose});
  });
  Promise.all([loadTags(),loadProverbs()]).then(([t,a])=>{ T=t; all=a; by=byIdMap(a); choose(); }).catch(()=>fitMsg(LOADFAIL));
  q.addEventListener('input',()=>{
    if(!T) return; const t=q.value.trim().replace(/\s+/g,''); if(!t){ choose(); return; }
    const r=all.filter(p=>p.n.includes(t)||p.mn.includes(t)).sort(byKo);
    fitResults(rP([t]),r,{e:'🔍',title:`‘${q.value.trim()}’ 속담 ${r.length}개`,onBack:()=>{ q.value=''; choose(); }});
  });
}

/* 글자로 찾기 (우리말) */
function renderWfind(){
  const J='ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
  return fitShell('w-f-char','🔡','글자로 찾기','첫 글자 자음이나 글자로 순우리말을 찾아요',
   `<div class="fin"><input id="wfq" type="search" enterkeyhint="search" autocomplete="off" placeholder="첫 글자 자음을 넣어 보세요" aria-label="찾을 글자"><button class="fclr" id="wfx" aria-label="지우기">✕</button></div>
    <div class="jamo" id="wfj">${[...J].map(c=>`<button data-j="${c}">${c}</button>`).join('')}</div>
    <div class="fchips" id="wfl"><button class="chip" data-l="2">2글자</button><button class="chip" data-l="3">3글자</button><button class="chip" data-l="4">4글자</button><button class="chip" data-l="5">5글자 이상</button></div>`);
}
function initWfind(){
  const q=fq('#wfq'); let data=[], len=0;
  const isJamo=t=>/^[ㄱ-ㅎ]+$/.test(t);
  const draw=()=>{
    const t=q.value.trim().replace(/\s+/g,'');
    if(!t&&!len){ const c=data.filter(x=>x.w.length>=2), x=c[Math.floor(Math.random()*c.length)]; fitOne('⭐ <b>오늘의 순우리말</b> · 자음이나 글자를 고르면 찾아 줘요',bcW(x)); return; }
    const j=isJamo(t), lenOk=x=>{ const n=[...x.w].length; return !len||(len===5?n>=5:n===len); };
    const r=data.filter(x=>lenOk(x)&&(!t||(j?x.ini.startsWith(t):x.w.startsWith(t))));
    const lt=len?(len===5?'5글자 이상':len+'글자'):'';
    fitResults(rW(t?[t]:[]),r,{e:'🔍',title:`${t?'‘'+t+'’ ':''}${lt} 순우리말 ${r.length}개`});
  };
  const setJ=c=>fq('#wfj').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.j===c));
  loadWords().then(a=>{ data=a; draw(); }).catch(()=>fitMsg(LOADFAIL));
  q.addEventListener('input',()=>{ setJ(q.value.trim()); data.length&&draw(); });
  fq('#wfj').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; q.value=b.dataset.j; setJ(b.dataset.j); data.length&&draw(); };
  fq('#wfl').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; len=(len===+c.dataset.l)?0:+c.dataset.l; fq('#wfl').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',+x.dataset.l===len)); data.length&&draw(); };
  fq('#wfx').onclick=()=>{ q.value=''; setJ(''); len=0; fq('#wfl').querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); data.length&&draw(); q.focus(); };
}

/* ---------- 라우팅 (#이름) ---------- */
function route(){
  let h = (location.hash||'').slice(1) || 'home';
  if(h==='p-media') h='p-video'; if(h==='w-media') h='w-video';
  let html;
  if(h==='home') html=viewHome();
  else if(MENU[h]) html=viewHub(h);
  else if(groupIndex[h]) html=viewGroup(h);
  else if(leafIndex[h]) html=viewLeaf(h);
  else if(h==='help') html=viewHelp();
  else if(h==='status') html=viewStatus();
  else html=viewHome();
  $app.innerHTML = html;
  window.scrollTo(0,0);
  const lf=leafIndex[h]; if(lf && lf.status==='done' && lf.init) lf.init();
}
function go(id){ if(location.hash==='#'+id) route(); else location.hash = id; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
window.addEventListener('hashchange',route);
route();

/* ---------- 앱 설치 ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
document.addEventListener('click',e=>{
  if(e.target.closest('#installBtn') && deferredPrompt){
    e.stopImmediatePropagation();
    deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;});
  }
},true);
if('serviceWorker' in navigator){
  let hadSW=!!navigator.serviceWorker.controller, rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadSW&&!rl){ rl=true; location.reload(); } hadSW=true; });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ r.update().catch(()=>{}); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) r.update().catch(()=>{}); }); }).catch(()=>{}); });
}
